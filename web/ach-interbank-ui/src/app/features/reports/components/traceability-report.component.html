<app-page-header
  title="Reporte de trazabilidad ACH"
  subtitle="Genera el PDF por filtros de estado, ciclo y rango de fechas"
  [actionsTemplate]="headerActions"
></app-page-header>

<section class="toolbar">
  <form [formGroup]="form" class="filters" (ngSubmit)="generatePdf()">
    <label>
      Desde (UTC)
      <input type="date" formControlName="fromUtc" />
    </label>
    <label>
      Hasta (UTC)
      <input type="date" formControlName="toUtc" />
    </label>
    <label>
      Estado
      <select formControlName="state">
        <option *ngFor="let item of states" [ngValue]="item.value">{{ item.label }}</option>
      </select>
    </label>
    <label>
      Ciclo ACH (selección múltiple)
      <select formControlName="achCycleId" multiple size="5">
        <option *ngFor="let cycle of achCycleOptions" [ngValue]="cycle.id">{{ cycle.label }} ({{ cycle.id }})</option>
      </select>
      <small class="muted">Puedes seleccionar uno o varios ciclos manteniendo Ctrl/Cmd.</small>
    </label>
    <button type="submit" [disabled]="loading">
      {{ loading ? 'Generando...' : 'Generar PDF' }}
    </button>
  </form>
</section>

<section class="help">
  <p>
    El archivo incluirá el consolidado de transacciones ACH con los filtros aplicados.
  </p>
</section>

<ng-template #headerActions>
  <a routerLink="/reports" class="link">Volver a reportes</a>
</ng-template>
