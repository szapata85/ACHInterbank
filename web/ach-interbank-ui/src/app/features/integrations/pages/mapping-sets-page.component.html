<section class="mapping-list-page">
  <ui-migas-pan [items]="migas"></ui-migas-pan>
  <ui-encabezado-pagina
    titulo="Configuraciones funcionales por integración"
    descripcion="Gestione borradores, validación y publicación de configuraciones de mapeo por método."
  ></ui-encabezado-pagina>

  <section class="cards">
    <article class="card metric"><span>Total</span><strong>{{ stats.total }}</strong></article>
    <article class="card metric"><span>Borrador</span><strong>{{ stats.draft }}</strong></article>
    <article class="card metric"><span>Publicado</span><strong>{{ stats.published }}</strong></article>
    <article class="card metric"><span>Archivado</span><strong>{{ stats.archived }}</strong></article>
  </section>

  <ng-template #borradorTpl>
    <form [formGroup]="createDraftForm" class="draft-form" (ngSubmit)="createDraft()">
      <label>
        Integración
        <select formControlName="methodId" (change)="onMethodChange()">
          <option *ngFor="let method of methods" [ngValue]="method.id">
            {{ method.displayName }} — {{ method.code }}
          </option>
        </select>
      </label>
      <label>
        Nombre de versión de trabajo
        <input type="text" formControlName="name" placeholder="Ej: Contrapartidas - Ajuste operativo abril" />
      </label>
      <label>
        Comentario del borrador
        <input type="text" formControlName="notes" placeholder="Qué se está ajustando en esta versión" />
      </label>
      <button type="submit" class="btn btn-primary" [disabled]="createDraftForm.invalid || creatingDraft">
        {{ creatingDraft ? 'Creando…' : 'Crear borrador' }}
      </button>
    </form>
  </ng-template>
  <ui-tarjeta titulo="Nuevo borrador" subtitulo="Crear una versión de trabajo para ajustar reglas funcionales." [contenido]="borradorTpl"></ui-tarjeta>

  <ng-template #versionesTpl>
    <div class="table-header">
      <ui-boton texto="Comparar versiones" icono="compare_arrows" [deshabilitado]="mappingSets.length < 2" (accion)="openCompare()"></ui-boton>
    </div>
    <ui-grilla-empresarial
      [columnas]="columnas"
      [datos]="filasGrilla"
      [cargando]="loading"
      [error]="false"
      [tamanoPagina]="10"
      [mensajeVacio]="'No hay versiones para la integración seleccionada.'"
      [mensajeCargando]="'Cargando configuraciones...'"
    ></ui-grilla-empresarial>
    <p class="helper" *ngIf="mappingSets.length < 2">Necesitas al menos dos versiones para habilitar la comparación.</p>
  </ng-template>
  <ui-tarjeta titulo="Versiones y estados" subtitulo="Consulta y comparación de versiones por método." [contenido]="versionesTpl"></ui-tarjeta>
</section>
