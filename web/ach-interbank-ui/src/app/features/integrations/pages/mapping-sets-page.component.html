<div class="mapping-list-page">
  <section class="cards">
    <article class="card metric"><span>Total</span><strong>{{ stats.total }}</strong></article>
    <article class="card metric"><span>Borrador</span><strong>{{ stats.draft }}</strong></article>
    <article class="card metric"><span>Publicado</span><strong>{{ stats.published }}</strong></article>
    <article class="card metric"><span>Archivado</span><strong>{{ stats.archived }}</strong></article>
  </section>

  <section class="card controls">
    <h3>Nuevo borrador de configuración funcional</h3>
    <form [formGroup]="createDraftForm" class="draft-form" (ngSubmit)="createDraft()">
      <label>
        Integración
        <select formControlName="methodId" (change)="onMethodChange()">
          <option *ngFor="let method of methods" [ngValue]="method.id">
            {{ method.displayName }} — {{ method.code }}
          </option>
        </select>
      </label>
      <label>
        Nombre de versión de trabajo
        <input type="text" formControlName="name" placeholder="Ej: Contrapartidas - Ajuste operativo abril" />
      </label>
      <label>
        Comentario del borrador
        <input type="text" formControlName="notes" placeholder="Qué se está ajustando en esta versión" />
      </label>
      <button type="submit" class="btn btn-primary" [disabled]="createDraftForm.invalid || creatingDraft">
        {{ creatingDraft ? 'Creando…' : 'Crear borrador' }}
      </button>
    </form>
  </section>

  <section class="card table-card">
    <div class="table-header">
      <h3>Versiones y estados</h3>
      <button type="button" [disabled]="mappingSets.length < 2" (click)="openCompare()">Comparar versiones</button>
    </div>
    <div class="table-wrap">
      <ui-grilla-empresarial
        [columnas]="columnas"
        [datos]="filasGrilla"
        [cargando]="loading"
        [error]="false"
        [tamanoPagina]="10"
        [mensajeVacio]="'No hay versiones para la integración seleccionada.'"
        [mensajeCargando]="'Cargando información...'"
      ></ui-grilla-empresarial>
    </div>
    <p class="helper" *ngIf="mappingSets.length < 2">
      Necesitas al menos dos versiones para habilitar la comparación.
    </p>
  </section>
</div>
