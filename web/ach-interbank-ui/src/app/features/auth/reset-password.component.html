<section class="auth-card" aria-labelledby="reset-password-title">
  <header>
    <h1 id="reset-password-title">Restablecer contraseña</h1>
    <p>Crea una nueva contraseña para recuperar tu acceso.</p>
  </header>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="field">
      <span>Nueva contraseña</span>
      <input type="password" formControlName="newPassword" autocomplete="new-password" />
      <small *ngIf="form.get('newPassword')?.touched && form.get('newPassword')?.invalid">
        Debe tener al menos 6 caracteres.
      </small>
    </label>

    <label class="field">
      <span>Confirmar contraseña</span>
      <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
      <small *ngIf="form.hasError('passwordMismatch') && form.get('confirmPassword')?.touched">
        Las contraseñas no coinciden.
      </small>
    </label>

    <app-error-message [text]="errorMessage"></app-error-message>
    <p class="success" *ngIf="successMessage">{{ successMessage }}</p>

    <div class="actions">
      <button type="button" class="link" (click)="goToForgot()">¿No tienes enlace? Solicita uno</button>
      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Actualizando...' : 'Guardar nueva contraseña' }}
      </button>
    </div>
  </form>
</section>
