<section class="auth-card" aria-labelledby="forgot-password-title">
  <header>
    <h1 id="forgot-password-title">Recupera tu acceso</h1>
    <p>Indica tu correo y, si existe, enviaremos un enlace para restablecer tu contraseña.</p>
  </header>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="field">
      <span>Correo electrónico</span>
      <input type="email" formControlName="email" autocomplete="email" />
      <small *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
        Ingresa un correo válido.
      </small>
    </label>

    <app-error-message [text]="errorMessage"></app-error-message>
    <p class="success" *ngIf="successMessage">{{ successMessage }}</p>

    <div class="actions">
      <button type="button" class="link" (click)="backToLogin()">Volver a iniciar sesión</button>
      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Enviando...' : 'Enviar enlace' }}
      </button>
    </div>
  </form>
</section>
