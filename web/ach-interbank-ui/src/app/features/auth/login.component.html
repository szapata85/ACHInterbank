<section class="login-card" aria-labelledby="login-title">
  <header>
    <h1 id="login-title">Ingreso al portal ACH Interbank</h1>
    <p>Autentícate para gestionar transacciones y catálogos.</p>
  </header>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="field">
      <span>Usuario</span>
      <input type="text" formControlName="username" autocomplete="username" />
      <small *ngIf="form.get('username')?.touched && form.get('username')?.invalid">
        Ingrese un usuario válido.
      </small>
    </label>

    <label class="field">
      <span>Contraseña</span>
      <div class="password-field">
        <input
          [type]="passwordVisible ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="password-toggle"
          (click)="togglePasswordVisibility()"
          [attr.aria-pressed]="passwordVisible"
          [attr.aria-label]="passwordVisible ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          <span class="sr-only">{{ passwordVisible ? 'Ocultar' : 'Mostrar' }}</span>
          <svg
            *ngIf="!passwordVisible"
            aria-hidden="true"
            class="icon"
            viewBox="0 0 24 24"
            focusable="false"
          >
            <path
              d="M1 12s4.5-7 11-7 11 7 11 7-4.5 7-11 7S1 12 1 12Zm11 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle
              cx="12"
              cy="12"
              r="1.9"
              fill="currentColor"
            />
          </svg>
          <svg
            *ngIf="passwordVisible"
            aria-hidden="true"
            class="icon"
            viewBox="0 0 24 24"
            focusable="false"
          >
            <path
              d="m3 3 18 18M7.2 7.38C4.93 8.98 3 12 3 12s4.5 7 11 7c1.4 0 2.72-.36 3.95-.99M10.55 10.63a3.5 3.5 0 0 0 4.82 4.82"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
      <small *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
        La contraseña debe tener al menos 6 caracteres.
      </small>
    </label>

    <app-error-message [text]="errorMessage"></app-error-message>

    <button type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Ingresando...' : 'Ingresar' }}
    </button>

    <div class="helper-links">
      <a routerLink="/auth/forgot-password">¿Olvidaste tu clave?</a>
    </div>
  </form>
</section>
