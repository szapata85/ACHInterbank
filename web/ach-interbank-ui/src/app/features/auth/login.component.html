<section class="login-card" aria-labelledby="login-title">
  <header>
    <h1 id="login-title">Ingreso al portal ACH Interbank</h1>
    <p>Autentícate para gestionar transacciones y catálogos.</p>
  </header>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="field">
      <span>Usuario</span>
      <input type="text" formControlName="username" autocomplete="username" />
      <small *ngIf="form.get('username')?.touched && form.get('username')?.invalid">
        Ingrese un usuario válido.
      </small>
    </label>

    <label class="field">
      <span>Contraseña</span>
      <div class="password-field">
        <input
          [type]="passwordVisible ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="password-toggle"
          (click)="togglePasswordVisibility()"
          [attr.aria-pressed]="passwordVisible"
          [attr.aria-label]="passwordVisible ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          <span class="sr-only">{{ passwordVisible ? 'Ocultar' : 'Mostrar' }}</span>
          <svg *ngIf="!passwordVisible" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
            <path
              d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12zm11 3a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
              fill="currentColor"
            />
          </svg>
          <svg *ngIf="passwordVisible" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
            <path
              d="M3.28 2.22 21.78 20.7l-1.06 1.08-2.14-2.14C16.96 20.53 15.05 21 12.9 21 6.83 21 3 12 3 12c.62-1.35 1.36-2.56 2.2-3.6L2.22 3.3 3.28 2.2Zm4.6 4.6C9.01 6.3 10.24 6 11.53 6 17.6 6 21.44 15 21.44 15c-.38.83-.82 1.61-1.31 2.32l-2.77-2.77A4.5 4.5 0 0 0 9.88 8.1L7.87 6.82ZM12 9.5a2.5 2.5 0 0 1 2.4 3.2l-3.1-3.1c.23-.06.47-.1.7-.1Z"
              fill="currentColor"
            />
          </svg>
        </button>
      </div>
      <small *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
        La contraseña debe tener al menos 6 caracteres.
      </small>
    </label>

    <app-error-message [text]="errorMessage"></app-error-message>

    <button type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Ingresando...' : 'Ingresar' }}
    </button>

    <div class="helper-links">
      <a routerLink="/auth/forgot-password">¿Olvidaste tu clave?</a>
    </div>
  </form>
</section>
