<section class="login-card" aria-labelledby="login-title">
  <header>
    <h1 id="login-title">Ingreso al portal ACH Interbank</h1>
    <p>Autentícate para gestionar transacciones y catálogos.</p>
  </header>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="field">
      <span>Usuario</span>
      <input type="text" formControlName="username" autocomplete="username" />
      <small *ngIf="form.get('username')?.touched && form.get('username')?.invalid">
        Ingrese un usuario válido.
      </small>
    </label>

    <label class="field">
      <span>Contraseña</span>
      <div class="password-field">
        <input
          [type]="passwordVisible ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="password-toggle"
          (click)="togglePasswordVisibility()"
          [attr.aria-pressed]="passwordVisible"
          [attr.aria-label]="passwordVisible ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          <span class="sr-only">{{ passwordVisible ? 'Ocultar' : 'Mostrar' }}</span>
          <svg
            *ngIf="!passwordVisible"
            aria-hidden="true"
            class="icon"
            viewBox="0 0 24 24"
            focusable="false"
          >
            <path
              d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle
              cx="12"
              cy="12"
              r="3.2"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
            />
            <circle cx="12" cy="12" r="1.3" fill="currentColor" />
          </svg>
          <svg
            *ngIf="passwordVisible"
            aria-hidden="true"
            class="icon"
            viewBox="0 0 24 24"
            focusable="false"
          >
            <path
              d="m3 3 18 18"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M5 8.5C3 10 2 12 2 12s4 7 10 7c1.93 0 3.64-.48 5.1-1.25M9.52 9.6c.7-.53 1.57-.85 2.48-.85 2.3 0 4.16 1.86 4.16 4.16 0 .95-.32 1.81-.86 2.51"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M11.7 15.6c-.4-.03-.8-.14-1.17-.32"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
      <small *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
        La contraseña debe tener al menos 6 caracteres.
      </small>
    </label>

    <app-error-message [text]="errorMessage"></app-error-message>

    <button type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Ingresando...' : 'Ingresar' }}
    </button>

    <div class="helper-links">
      <a routerLink="/auth/forgot-password">¿Olvidaste tu clave?</a>
    </div>
  </form>
</section>
