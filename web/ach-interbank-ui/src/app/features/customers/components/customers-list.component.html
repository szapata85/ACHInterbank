<app-page-header title="Clientes" subtitle="Administra los clientes registrados" [actionsTemplate]="headerActions">
</app-page-header>

<ng-template #headerActions>
  <button type="button" class="btn btn-primary" (click)="create()">Nuevo cliente</button>
</ng-template>

<section class="card filters" [formGroup]="filtersForm">
  <label>
    Documento
    <input type="text" formControlName="document" placeholder="CC 123456" />
  </label>
  <label>
    Nombre
    <input type="text" formControlName="name" placeholder="Nombre del cliente" />
  </label>
  <label>
    Cuenta
    <input type="text" formControlName="account" placeholder="Número de cuenta" />
  </label>
  <label>
    Tipo persona
    <select formControlName="personType">
      <option value="">Todos</option>
      <option value="PN">Persona natural</option>
      <option value="PJ">Persona jurídica</option>
    </select>
  </label>
  <div class="filter-actions">
    <button type="button" class="btn btn-outline" (click)="resetFilters()">Limpiar filtros</button>
  </div>
</section>

<section class="card">
  <ui-grilla-empresarial
    [columnas]="columnas"
    [datos]="filasGrilla"
    [cargando]="loading"
    [error]="false"
    [tamanoPagina]="20"
    [mensajeVacio]="'No hay clientes registrados para los filtros seleccionados.'"
    [mensajeCargando]="'Cargando información...'"
  ></ui-grilla-empresarial>
</section>
