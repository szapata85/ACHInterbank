<app-page-header title="Mappings de respuestas ACH" description="Administración versionada de estados y causales por cámara"></app-page-header>

<p class="nota-operativa">Las desactivaciones conservan el historial y toda modificación exige justificación.</p>

<div class="acciones">
  <ui-boton texto="Nuevo mapping" variante="primario" [deshabilitado]="loading || saving" (accion)="newMapping()"></ui-boton>
</div>

<form *ngIf="editorVisible" class="filtros" [formGroup]="mappingForm" (ngSubmit)="saveMapping()">
  <div class="campo"><label>Selector de cámara (ID)</label><input type="number" min="1" formControlName="clearingHouseId" /></div>
  <div class="campo"><label>Tipo de respuesta</label><select formControlName="responseType"><option value="Transaccion">Transacción</option><option value="Prenota">Prenota</option></select></div>
  <div class="campo"><label>Código externo</label><input type="text" formControlName="externalCode" /></div>
  <div class="campo"><label>Causal externa</label><input type="text" formControlName="externalCause" /></div>
  <div class="campo"><label>ID estado interno</label><input type="number" min="1" formControlName="internalStatusId" /></div>
  <div class="campo"><label>ID estado servicio externo</label><input type="number" min="1" formControlName="externalServiceStatusId" /></div>
  <div class="campo"><label>Nombre estado interno</label><input type="text" formControlName="internalStatusName" /></div>
  <div class="campo"><label>Causal normalizada</label><input type="text" formControlName="normalizedCause" /></div>
  <div class="campo"><label>Descripción normalizada</label><input type="text" formControlName="normalizedDescription" /></div>
  <div class="campo"><label>Prioridad</label><input type="number" formControlName="priority" /></div>
  <div class="campo"><label>Inicio de vigencia</label><input type="date" formControlName="effectiveFrom" /></div>
  <div class="campo"><label>Fin de vigencia</label><input type="date" formControlName="effectiveTo" /></div>
  <div class="campo"><label><input type="checkbox" formControlName="requiresCause" /> Requiere causal</label></div>
  <div class="campo"><label><input type="checkbox" formControlName="allowsNotification" /> Permite notificación</label></div>
  <div class="campo"><label><input type="checkbox" formControlName="isActive" /> Activo</label></div>
  <div class="campo"><label>Justificación obligatoria</label><textarea formControlName="reason" rows="2"></textarea></div>
  <div class="acciones">
    <ui-boton texto="Guardar" variante="primario" [deshabilitado]="saving" (accion)="saveMapping()"></ui-boton>
    <ui-boton texto="Cancelar" variante="contorno" [deshabilitado]="saving" (accion)="cancelEditor()"></ui-boton>
  </div>
</form>

<form class="filtros" [formGroup]="filtrosForm" (ngSubmit)="applyFilters()">
  <div class="campo"><label>Cámara</label><input type="text" formControlName="codigoCamaraCompensacion" /></div>
  <div class="campo"><label>Tipo respuesta</label><select formControlName="tipoRespuesta"><option *ngFor="let tipo of tiposRespuesta" [value]="tipo">{{ tipo || 'Todos' }}</option></select></div>
  <div class="campo"><label>Activo</label><select formControlName="activo"><option *ngFor="let estado of activos" [value]="estado">{{ estado === '' ? 'Todos' : (estado === 'true' ? 'Sí' : 'No') }}</option></select></div>
  <div class="acciones">
    <ui-boton texto="Buscar" variante="primario" [deshabilitado]="loading" (accion)="applyFilters()"></ui-boton>
    <ui-boton texto="Limpiar" variante="contorno" [deshabilitado]="loading" (accion)="clearFilters()"></ui-boton>
  </div>
</form>

<p class="resumen">Mostrando {{ rows.length }} mappings.</p>

<ui-grilla-empresarial [columnas]="columnas" [datos]="rows" [cargando]="loading" [error]="error"
  [mensajeError]="'No fue posible cargar los mappings ACH'" [mensajeCargando]="'Cargando mappings ACH...'"
  [tituloVacio]="'Sin mappings'" [mensajeVacio]="'No se encontraron mappings con los filtros aplicados.'"
  [placeholderBusqueda]="'Buscar en mappings...'">
</ui-grilla-empresarial>
