<app-page-header title="Log de navegación" subtitle="Consulta la navegación de usuarios en la aplicación"></app-page-header>

<section class="navigation-log">
  <form class="form-grid" [formGroup]="filterForm" (ngSubmit)="search()">
    <label>
      Fecha inicio
      <input type="date" formControlName="startDate" />
    </label>

    <label>
      Fecha fin
      <input type="date" formControlName="endDate" />
    </label>

    <label>
      Usuario (ID)
      <input type="text" formControlName="userId" placeholder="ID del usuario" />
    </label>

    <label>
      Ruta
      <input type="text" formControlName="route" placeholder="/transactions/create" />
    </label>

    <div class="form-actions">
      <button type="submit" class="primary" [disabled]="loading">Buscar</button>
      <button type="button" class="ghost" (click)="clear()" [disabled]="loading">Limpiar</button>
    </div>
  </form>

  <app-table
    [columns]="columns"
    [data]="rows"
    [loading]="loading"
    [page]="page"
    [pageSize]="pageSize"
    [total]="total"
    (pageChange)="onPageChange($event)"
  ></app-table>

  <div class="empty-state" *ngIf="!loading && !hasSearched">
    Usa los filtros y presiona buscar para cargar resultados.
  </div>
</section>
