<section class="settings-page" aria-labelledby="login-lockout-title">
  <header class="page-heading"><h2 id="login-lockout-title">Bloqueo de acceso</h2><p>Define los intentos fallidos permitidos y el tiempo de bloqueo automático.</p></header>
  <mat-card><mat-card-content><form [formGroup]="form" (ngSubmit)="save()" class="form-grid" novalidate>
    <mat-form-field appearance="outline"><mat-label>Intentos fallidos permitidos</mat-label><input matInput type="number" formControlName="maxFailedAttempts" min="1" max="20" required /><mat-hint>Entre 1 y 20 intentos.</mat-hint><mat-error *ngIf="form.get('maxFailedAttempts')?.invalid">Ingresa un valor entre 1 y 20.</mat-error></mat-form-field>
    <mat-form-field appearance="outline"><mat-label>Minutos de bloqueo automático</mat-label><input matInput type="number" formControlName="lockoutMinutes" min="1" max="60" required /><mat-hint>Entre 1 y 60 minutos.</mat-hint><mat-error *ngIf="form.get('lockoutMinutes')?.invalid">Ingresa un valor entre 1 y 60.</mat-error></mat-form-field>
    <div class="actions"><button mat-button type="button" routerLink="/users/list" [disabled]="saving">Cancelar</button><button mat-flat-button color="primary" type="submit" [disabled]="saving"><mat-spinner *ngIf="saving" diameter="18"></mat-spinner><span>{{ saving ? 'Guardando...' : 'Guardar cambios' }}</span></button></div>
  </form></mat-card-content></mat-card>
</section>
