<div class="card">
  <h2>{{ isEdit ? 'Editar usuario' : 'Nuevo usuario' }}</h2>

  <form [formGroup]="form" (ngSubmit)="save()" class="form-grid">
    <label>
      Usuario
      <input type="text" formControlName="userName" />
      <app-error-message [control]="form.get('userName')"></app-error-message>
    </label>

    <label>
      Nombre completo
      <input type="text" formControlName="fullName" />
    </label>

    <label>
      Email
      <input type="email" formControlName="email" (blur)="onEmailBlur()" />
      <app-error-message [control]="form.get('email')"></app-error-message>
    </label>

    <label>
      Teléfono
      <input type="text" formControlName="phoneNumber" />
    </label>

    <label>
      Contraseña
      <input type="password" formControlName="password" [required]="!isEdit" />
      <small class="hint" *ngIf="!isEdit">
        Mínimo {{ passwordRules.minLength }} caracteres,
        {{ passwordRules.minUppercase }} mayúscula(s),
        {{ passwordRules.minNumbers }} número(s),
        {{ passwordRules.minSpecial }} caracter(es) especial(es).
        Máximo {{ passwordRules.maxSpecial }} especiales.
      </small>
      <div class="strength" *ngIf="!isEdit">
        <div class="strength__bar" [style.width.%]="(passwordStrength / 5) * 100"></div>
        <span class="strength__label">{{ passwordStrengthLabel }}</span>
      </div>
      <app-error-message *ngIf="form.get('password')?.hasError('weakPassword')" [control]="form.get('password')">
      </app-error-message>
    </label>

    <label>
      Roles
      <select formControlName="roleIds" multiple>
        <option *ngFor="let role of roles" [value]="role.id">{{ role.name }}</option>
      </select>
    </label>

    <div class="actions">
      <button type="button" routerLink="/users">Cancelar</button>
      <button type="submit" class="primary">Guardar</button>
    </div>
  </form>
</div>
