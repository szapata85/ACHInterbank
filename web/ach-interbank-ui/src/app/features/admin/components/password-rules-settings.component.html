<div class="card">
  <h2>Reglas de contraseña</h2>
  <p class="subtitle">Configura la complejidad mínima requerida para nuevas contraseñas.</p>

  <form [formGroup]="form" (ngSubmit)="save()" class="form-grid">
    <label>
      Mínimo de caracteres
      <input type="number" formControlName="minLength" min="1" />
      <app-error-message [control]="form.get('minLength')"></app-error-message>
    </label>

    <label>
      Mínimo de mayúsculas
      <input type="number" formControlName="minUppercase" min="0" />
      <app-error-message [control]="form.get('minUppercase')"></app-error-message>
    </label>

    <label>
      Mínimo de números
      <input type="number" formControlName="minNumbers" min="0" />
      <app-error-message [control]="form.get('minNumbers')"></app-error-message>
    </label>

    <label>
      Mínimo de caracteres especiales
      <input type="number" formControlName="minSpecial" min="0" />
      <app-error-message [control]="form.get('minSpecial')"></app-error-message>
    </label>

    <label>
      Máximo de caracteres especiales
      <input type="number" formControlName="maxSpecial" min="0" />
      <app-error-message [control]="form.get('maxSpecial')"></app-error-message>
    </label>

    <div class="actions">
      <button type="button" routerLink="/users">Cancelar</button>
      <button type="submit" class="btn btn-primary" (click)="save()">Guardar</button>
    </div>
  </form>
</div>
