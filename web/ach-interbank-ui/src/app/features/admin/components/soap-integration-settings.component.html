<div class="soap-settings-card">
  <header class="page-header">
    <ui-migas-pan [items]="migas"></ui-migas-pan>
    <ui-encabezado-pagina
      titulo="Integraciones SOAP ACH"
      descripcion="Configuración técnica avanzada para endpoint, SOAP Action y parámetros de entrada por método."
    ></ui-encabezado-pagina>
    <ui-alerta tipo="info" mensaje="Si necesitas ajustar reglas funcionales, utiliza la sección de configuración funcional de integraciones."></ui-alerta>
  </header>

  <form [formGroup]="form" (ngSubmit)="save()" class="form-grid">
    <div class="methods-stack">
      <div formArrayName="wscfaachMappings" class="method-list">
        <article class="method-block" *ngFor="let mapping of wscfaachMappings.controls; let i = index" [formGroupName]="i">
          <header class="method-block-header">
            <h3>WscfaachSoapClient</h3>
            <span class="method-name">{{ mapping.get('methodName')?.value }}</span>
          </header>

          <section class="sub-block technical-block">
            <h4>Configuración técnica</h4>
            <div class="technical-fields">
              <label>
                Método técnico
                <input type="text" formControlName="methodName" readonly />
              </label>
              <label class="field-wide">
                Endpoint
                <input type="text" formControlName="endpoint" placeholder="https://..." />
                <app-error-message [control]="mapping.get('endpoint')"></app-error-message>
              </label>
              <label class="field-wide">
                SOAP Action
                <input type="text" formControlName="soapAction" />
                <app-error-message [control]="mapping.get('soapAction')"></app-error-message>
              </label>
              <label class="check">
                <input type="checkbox" formControlName="enabled" />
                Habilitado
              </label>
            </div>
          </section>

          <section class="sub-block input-mappings" formArrayName="inputParameterMappings">
            <div class="mapping-header">
              <h4>Mapeo de parámetros de entrada</h4>
              <button type="button" class="btn btn-sm" (click)="addInputMapping(mapping)">+ Agregar parámetro</button>
            </div>

            <div class="mapping-list">
              <div class="mapping-row" *ngFor="let inputMapping of getInputMappings(mapping).controls; let j = index" [formGroupName]="j">
                <label>
                  Parámetro de entrada
                  <input type="text" formControlName="inputName" placeholder="ej: usuario" />
                </label>
                <label>
                  Parámetro SOAP destino (técnico)
                  <input type="text" formControlName="soapParameterName" placeholder="ej: Usuario" />
                </label>
                <label>
                  Valor por defecto
                  <input type="text" formControlName="defaultValue" placeholder="opcional" />
                </label>
                <label class="check-inline">
                  <input type="checkbox" formControlName="required" /> Requerido
                </label>
                <button type="button" class="btn btn-danger" (click)="removeInputMapping(mapping, j)">Eliminar</button>
              </div>
            </div>
          </section>
        </article>
      </div>

      <div formArrayName="wsAxonRespuestaTransaccionesMappings" class="method-list">
        <article class="method-block" *ngFor="let mapping of wsAxonMappings.controls; let i = index" [formGroupName]="i">
          <header class="method-block-header">
            <h3>WsAxonRespuestaTransaccionesSoapClient</h3>
            <span class="method-name">{{ mapping.get('methodName')?.value }}</span>
          </header>

          <section class="sub-block technical-block">
            <h4>Configuración técnica</h4>
            <div class="technical-fields">
              <label>
                Método técnico
                <input type="text" formControlName="methodName" readonly />
              </label>
              <label class="field-wide">
                Endpoint
                <input type="text" formControlName="endpoint" placeholder="https://..." />
                <app-error-message [control]="mapping.get('endpoint')"></app-error-message>
              </label>
              <label class="field-wide">
                SOAP Action
                <input type="text" formControlName="soapAction" />
                <app-error-message [control]="mapping.get('soapAction')"></app-error-message>
              </label>
              <label class="check">
                <input type="checkbox" formControlName="enabled" />
                Habilitado
              </label>
            </div>
          </section>

          <section class="sub-block input-mappings" formArrayName="inputParameterMappings">
            <div class="mapping-header">
              <h4>Mapeo de parámetros de entrada</h4>
              <button type="button" class="btn btn-sm" (click)="addInputMapping(mapping)">+ Agregar parámetro</button>
            </div>

            <div class="mapping-list">
              <div class="mapping-row" *ngFor="let inputMapping of getInputMappings(mapping).controls; let j = index" [formGroupName]="j">
                <label>
                  Parámetro de entrada
                  <input type="text" formControlName="inputName" placeholder="ej: respuesta" />
                </label>
                <label>
                  Parámetro SOAP destino (técnico)
                  <input type="text" formControlName="soapParameterName" placeholder="ej: Respuesta" />
                </label>
                <label>
                  Valor por defecto
                  <input type="text" formControlName="defaultValue" placeholder="opcional" />
                </label>
                <label class="check-inline">
                  <input type="checkbox" formControlName="required" /> Requerido
                </label>
                <button type="button" class="btn btn-danger" (click)="removeInputMapping(mapping, j)">Eliminar</button>
              </div>
            </div>
          </section>
        </article>
      </div>
    </div>

    <div class="actions">
      <button type="button" routerLink="/integraciones">Cancelar</button>
      <button type="submit" class="btn btn-primary">Guardar</button>
    </div>
  </form>
</div>
