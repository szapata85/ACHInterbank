<section class="page" data-testid="nacha-config-variants-fields-page">
  <app-page-header
    title="NACHA Config - Variants y Fields"
    subtitle="Vista read-only oficial basada en nacha-config profiles."
  ></app-page-header>

  <ui-estado-error
    *ngIf="loadError"
    titulo="No fue posible cargar NACHA Config"
    [mensaje]="loadError"
    (reintentar)="load()"
  ></ui-estado-error>

  <app-table
    *ngIf="!loadError"
    [columns]="columns"
    [data]="profiles"
    [loading]="loading"
    [pageSize]="profiles.length || 10"
    [total]="profiles.length"
  >
    <ng-template #rowActions let-row>
      <a class="btn btn-outline" [routerLink]="['/nacha-config-admin/perfiles', row.profileId]">Ver perfil</a>
    </ng-template>
  </app-table>

  <ui-estado-vacio
    *ngIf="!loading && !loadError && profiles.length === 0"
    titulo="Sin nacha-config profiles"
    mensaje="No hay profiles oficiales disponibles para mostrar variants y fields."
  ></ui-estado-vacio>
</section>
