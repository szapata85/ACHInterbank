<ui-migas-pan [items]="[{ label: 'Inicio', route: '/dashboard' }, { label: 'NACHA Config' }]" />
<ui-encabezado-pagina titulo="Perfiles NACHA" descripcion="Administración enterprise de configuración NACHA-M"></ui-encabezado-pagina>

<ui-tarjeta titulo="Filtros y alta de borrador" subtitulo="Use filtros para operación y cree nuevos perfiles en estado BORRADOR.">
  <div class="filtros-grid" [formGroup]="filtrosForm">
    <ui-campo-texto etiqueta="Buscar" [control]="filtrosForm.controls.texto" placeholder="Código o nombre"></ui-campo-texto>
    <label class="selector-campo">
      <span>Estado</span>
      <ui-selector-buscable [opciones]="opcionesEstado" [formControl]="filtrosForm.controls.estado" placeholderBusqueda="Buscar estado"></ui-selector-buscable>
    </label>
    <label class="selector-campo">
      <span>Cámara</span>
      <ui-selector-buscable [opciones]="opcionesCamara" [formControl]="filtrosForm.controls.camara" placeholderBusqueda="Buscar cámara"></ui-selector-buscable>
    </label>
    <label class="selector-campo">
      <span>Flujo</span>
      <ui-selector-buscable [opciones]="opcionesFlujo" [formControl]="filtrosForm.controls.flujo" placeholderBusqueda="Buscar flujo"></ui-selector-buscable>
    </label>
    <label class="selector-campo">
      <span>Dirección</span>
      <ui-selector-buscable [opciones]="opcionesDireccion" [formControl]="filtrosForm.controls.direccion" placeholderBusqueda="Buscar dirección"></ui-selector-buscable>
    </label>
  </div>

  <div class="crear-grid" [formGroup]="crearForm">
    <ui-campo-texto etiqueta="Código perfil" [control]="crearForm.controls.profileCode"></ui-campo-texto>
    <ui-campo-texto etiqueta="Nombre" [control]="crearForm.controls.nombreEs"></ui-campo-texto>
    <label class="selector-campo">
      <span>Cámara</span>
      <ui-selector-buscable [opciones]="opcionesCamaraForm" [formControl]="crearForm.controls.camaraCode" placeholderBusqueda="Buscar cámara"></ui-selector-buscable>
    </label>
    <label class="selector-campo">
      <span>Flujo</span>
      <ui-selector-buscable [opciones]="opcionesFlujoForm" [formControl]="crearForm.controls.flujoCode" placeholderBusqueda="Buscar flujo"></ui-selector-buscable>
    </label>
    <label class="selector-campo">
      <span>Dirección</span>
      <ui-selector-buscable [opciones]="opcionesDireccionForm" [formControl]="crearForm.controls.direccionCode" placeholderBusqueda="Buscar dirección"></ui-selector-buscable>
    </label>
    <label class="selector-campo">
      <span>Servicio</span>
      <ui-selector-buscable [opciones]="opcionesServicio" [formControl]="crearForm.controls.servicioCode" placeholderBusqueda="Buscar servicio"></ui-selector-buscable>
    </label>
    <ui-campo-fecha etiqueta="Vigente desde" [control]="crearForm.controls.effectiveFrom"></ui-campo-fecha>
  </div>

  <div class="acciones">
    <ui-boton texto="Crear borrador" textoCargando="Creando..." [cargando]="guardando" [deshabilitado]="guardando" (accion)="crearBorrador()"></ui-boton>
  </div>
</ui-tarjeta>

<ui-grilla-empresarial
  [columnas]="columnas"
  [datos]="visibles"
  [cargando]="cargando"
  [error]="errorCarga"
  mensajeError="No fue posible cargar perfiles NACHA."
  tituloVacio="Sin perfiles"
  mensajeVacio="No hay perfiles para los filtros seleccionados."
  [paginacion]="true"
  [tamanoPagina]="15"
></ui-grilla-empresarial>
