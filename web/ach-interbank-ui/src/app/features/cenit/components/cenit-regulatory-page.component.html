<app-page-header [title]="titulo" [subtitle]="subtitulo"></app-page-header>

<section class="toolbar">
  <label>
    <span>Filtro rápido</span>
    <input type="text" [(ngModel)]="filtro" placeholder="Código, descripción o estado" />
  </label>
</section>

<section class="state" *ngIf="loading">Cargando información regulatoria...</section>
<section class="state error" *ngIf="!loading && error">{{ error }}</section>
<section class="state" *ngIf="!loading && !error && !hasRows">No hay registros para mostrar.</section>

<section class="table-wrapper" *ngIf="!loading && !error && hasRows">
  <ui-grilla-empresarial
    [columnas]="columnasTabla"
    [datos]="filteredRows"
    [cargando]="loading"
    [error]="false"
    [tamanoPagina]="20"
    [mensajeVacio]="'No se encontraron resultados'"
    [mensajeCargando]="'Cargando información...'"
  ></ui-grilla-empresarial>
</section>
