<section class="cenit-home">
  <ui-migas-pan [items]="migas"></ui-migas-pan>

  <ui-encabezado-pagina
    titulo="Centro de operación CENIT"
    descripcion="Supervisión regulatoria y operativa ACH con foco en ciclos, cola, neteo, optimización, devoluciones y trazabilidad."
  ></ui-encabezado-pagina>

  <ui-alerta
    tipo="info"
    titulo="Contexto operativo"
    mensaje="Use este módulo para seguimiento diario, análisis de causales y validación regulatoria con trazabilidad integral."
  ></ui-alerta>

  <ng-template #regulatorioTpl>
    <div class="cards">
      <article class="card" *ngFor="let item of regulatorio">
        <h3>{{ item.titulo }}</h3>
        <p>{{ item.descripcion }}</p>
        <a [routerLink]="item.ruta" class="link">Abrir consulta</a>
      </article>
    </div>
  </ng-template>

  <ui-tarjeta
    titulo="Paneles regulatorios"
    subtitulo="Consulta de catálogos, causales y políticas normativas vigentes."
    [contenido]="regulatorioTpl"
  ></ui-tarjeta>

  <ng-template #operacionTpl>
    <div class="cards">
      <article class="card" *ngFor="let item of operacion">
        <h3>{{ item.titulo }}</h3>
        <p>{{ item.descripcion }}</p>
        <a [routerLink]="item.ruta" class="link link-operativo">Abrir consulta</a>
      </article>
    </div>
  </ng-template>

  <ui-tarjeta
    titulo="Paneles operativos"
    subtitulo="Monitoreo crítico para operación diaria y cierre de cámara."
    [contenido]="operacionTpl"
  ></ui-tarjeta>
</section>
