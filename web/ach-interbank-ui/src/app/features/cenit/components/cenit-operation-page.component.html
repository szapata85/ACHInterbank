<section class="cenit-page">
  <ui-migas-pan [items]="migas"></ui-migas-pan>
  <ui-encabezado-pagina [titulo]="titulo" [descripcion]="subtitulo"></ui-encabezado-pagina>
  <ui-alerta tipo="info" [mensaje]="mensajeOperacion"></ui-alerta>
  <ui-alerta
    tipo="warning"
    titulo="Frontera operativa CENIT/CUD"
    mensaje="Liquidez simulada no equivale a saldo real CUD. Las decisiones mostradas son internas y operativas; no representan liquidación firme, no representan rechazo oficial CUD y no contabilizan. La evidencia CUD es operacional/manual y debe validarse con soporte externo aprobado."
  ></ui-alerta>

  <ng-template #resumenTpl>
    <section class="resumen-grid">
      <article class="resumen-item" *ngFor="let indicador of resumenVista">
        <p class="resumen-etiqueta">{{ indicador.etiqueta }}</p>
        <div class="resumen-valor">{{ indicador.valor }}</div>
        <ui-etiqueta-estado [estado]="indicador.estado" [texto]="indicador.estado | titlecase"></ui-etiqueta-estado>
      </article>
    </section>
  </ng-template>
  <ui-tarjeta titulo="Resumen operativo" subtitulo="Indicadores de control de la vista activa." [contenido]="resumenTpl"></ui-tarjeta>

  <ng-template #filtrosTpl>
    <section class="filtros-grid">
      <label class="campo-filtro">
        <span>Filtro operativo</span>
        <input type="text" [formControl]="filtroControl" placeholder="Transacción, ciclo, causal, lote, archivo o estado" />
      </label>
      <div class="acciones-filtro">
        <ui-boton texto="Limpiar filtros" variante="contorno" icono="filter_alt_off" (accion)="limpiarFiltros()"></ui-boton>
      </div>
    </section>
  </ng-template>
  <ui-barra-filtros [contenido]="filtrosTpl"></ui-barra-filtros>

  <ui-grilla-empresarial
    [columnas]="columnasTabla"
    [datos]="filteredRows"
    [cargando]="loading"
    [error]="!!error"
    [mensajeError]="error"
    [mensajeVacio]="mensajeVacio"
    [mensajeCargando]="'Consultando operación CENIT...'"
    [placeholderBusqueda]="'Buscar en resultados de operación'"
    [tamanoPagina]="20"
    [tituloVacio]="'Sin resultados operativos'"
  ></ui-grilla-empresarial>
</section>
