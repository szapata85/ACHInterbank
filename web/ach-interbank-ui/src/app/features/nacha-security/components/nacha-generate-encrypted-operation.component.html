<section class="operation-page">
  <app-page-header
    title="Generar NACHA-M cifrado"
    subtitle="Genera el archivo NACHA-M y su sobre digital cifrado con la configuración de seguridad vigente."
  ></app-page-header>

  <mat-card class="operation-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title>Parámetros de generación</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="operation-form">
        <mat-form-field appearance="outline">
          <mat-label>Identificador del ciclo</mat-label>
          <input matInput formControlName="cycleId" placeholder="Ej.: cycle-123" autocomplete="off" />
          <mat-hint>Usa el identificador del ciclo operativo que se va a procesar.</mat-hint>
          @if (form.controls.cycleId.hasError('required') && form.controls.cycleId.touched) {
            <mat-error>Ingresa el identificador del ciclo.</mat-error>
          }
        </mat-form-field>

        <div class="form-actions">
          <button mat-flat-button color="primary" type="submit" [disabled]="loading">
            <mat-icon aria-hidden="true">encrypted</mat-icon>
            {{ loading ? 'Procesando...' : 'Generar archivo cifrado' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>

  @if (operation) {
    <app-nacha-operation-summary
      [operation]="operation"
      [showHashes]="true"
    ></app-nacha-operation-summary>
  }
</section>
