<section class="operation-page">
  <app-page-header
    title="Cifrado manual de sobre digital"
    subtitle="Protege un archivo NACHA-M mediante la operación de cifrado administrada por el servidor."
  ></app-page-header>

  <mat-card class="operation-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title>Archivo para cifrar</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="operation-form">
        <div class="file-field">
          <label for="manual-encrypt-file">Archivo NACHA-M</label>
          <input id="manual-encrypt-file" type="file" (change)="onFileChange($event)" aria-describedby="manual-encrypt-help" />
          <small id="manual-encrypt-help">Selecciona el archivo que será protegido en el servidor.</small>
          @if (form.controls.file.hasError('required') && form.controls.file.touched) {
            <small role="alert">Selecciona un archivo para continuar.</small>
          }
        </div>

        <div class="form-actions">
          <button mat-flat-button color="primary" type="submit" [disabled]="loading">
            <mat-icon aria-hidden="true">lock</mat-icon>
            {{ loading ? 'Procesando...' : 'Cifrar archivo' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>

  @if (operation) {
    <app-nacha-operation-summary
      [operation]="operation"
      [showDownloadAvailability]="true"
    ></app-nacha-operation-summary>
  }
</section>
