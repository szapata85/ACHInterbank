<app-page-header
  title="Seguimiento de lotes masivos"
  description="Monitor de ejecución, estado operacional y reintentos para lotes ACH por archivo."
></app-page-header>

<section class="card toolbar">
  <div class="search-row">
    <div class="field">
      <label for="batchId">Batch ID</label>
      <input id="batchId" type="text" [ngModel]="batchIdInput()" (ngModelChange)="batchIdInput.set($event)" placeholder="GUID del lote" />
    </div>
    <button type="button" (click)="searchByBatchId()" [disabled]="isLoading()">Agregar al seguimiento</button>
    <button type="button" class="btn btn-outline" (click)="refreshFromRecent()" [disabled]="isLoading()">Actualizar</button>
  </div>

  <div class="field">
    <label for="statusFilter">Estado</label>
    <select id="statusFilter" [ngModel]="statusFilter()" (ngModelChange)="statusFilter.set($event)">
      <option value="ALL">Todos</option>
      <option value="1">Cargado</option>
      <option value="2">Parseado</option>
      <option value="3">Validado</option>
      <option value="4">En cola</option>
      <option value="5">Procesando</option>
      <option value="6">Parcialmente procesado</option>
      <option value="7">Completado</option>
      <option value="8">Fallido</option>
      <option value="9">Reintentando</option>
      <option value="10">Cancelado</option>
    </select>
  </div>
</section>

<section class="kpi-grid">
  <article class="card"><small>Lotes</small><strong>{{ totals().batches }}</strong></article>
  <article class="card"><small>Registros</small><strong>{{ totals().records }}</strong></article>
  <article class="card"><small>Exitosos</small><strong class="ok">{{ totals().succeeded }}</strong></article>
  <article class="card"><small>Fallidos</small><strong class="ko">{{ totals().failed }}</strong></article>
</section>

<ui-grilla-empresarial
  [columnas]="columnDefs"
  [datos]="filteredRows()"
  [cargando]="isLoading()"
  [paginacion]="true"
  [tamanoPagina]="15"
  [tituloVacio]="'Sin lotes en seguimiento'"
  [mensajeVacio]="'Agregue un Batch ID o registre lotes desde la pantalla de carga.'"
  [seleccionFilas]="{ mode: 'singleRow' }"
></ui-grilla-empresarial>
