<app-page-header
  title="Seguimiento de cargas"
  description="Monitor de ejecución, estado operacional y reintentos para lotes ACH por archivo."
></app-page-header>

<section class="card toolbar">
  <form class="search-row" [formGroup]="filtrosForm" (ngSubmit)="searchByBatchId()">
    <mat-form-field appearance="outline" class="batch-field">
      <mat-label>Identificador del lote</mat-label>
      <input
        matInput
        id="batchId"
        type="text"
        formControlName="batchId"
        (input)="onBatchIdInput($any($event.target).value)"
        placeholder="GUID del lote"
      />
    </mat-form-field>

    <button mat-flat-button type="submit" [disabled]="isLoading()">Agregar al seguimiento</button>
    <button mat-stroked-button type="button" [disabled]="isLoading()" (click)="refreshFromRecent()">Actualizar</button>
  </form>

  <mat-form-field appearance="outline" class="status-field">
    <mat-label>Estado</mat-label>
    <mat-select id="statusFilter" [formControl]="filtrosForm.controls.status">
      <mat-option value="ALL">Todos</mat-option>
      <mat-option value="1">Cargado</mat-option>
      <mat-option value="2">Parseado</mat-option>
      <mat-option value="3">Validado</mat-option>
      <mat-option value="4">En cola</mat-option>
      <mat-option value="5">Procesando</mat-option>
      <mat-option value="6">Parcialmente procesado</mat-option>
      <mat-option value="7">Completado</mat-option>
      <mat-option value="8">Fallido</mat-option>
      <mat-option value="9">Reintentando</mat-option>
      <mat-option value="10">Cancelado</mat-option>
    </mat-select>
  </mat-form-field>
</section>

<section class="kpi-grid">
  <article class="card"><small>Lotes</small><strong>{{ totals().batches }}</strong></article>
  <article class="card"><small>Registros</small><strong>{{ totals().records }}</strong></article>
  <article class="card"><small>Exitosos</small><strong class="ok">{{ totals().succeeded }}</strong></article>
  <article class="card"><small>Fallidos</small><strong class="ko">{{ totals().failed }}</strong></article>
</section>

<ui-grilla-empresarial
  [columnas]="columnDefs"
  [datos]="filteredRows()"
  [cargando]="isLoading()"
  [paginacion]="true"
  [tamanoPagina]="15"
  [tituloVacio]="'Sin lotes en seguimiento'"
  [mensajeVacio]="'Agregue un identificador de lote o registre lotes desde la pantalla de carga.'"
  [seleccionFilas]="{ mode: 'singleRow' }"
></ui-grilla-empresarial>
