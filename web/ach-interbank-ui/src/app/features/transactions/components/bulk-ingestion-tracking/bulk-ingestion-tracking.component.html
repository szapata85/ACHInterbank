<app-page-header
  title="Seguimiento de lotes masivos"
  description="Monitor de ejecución, estado operacional y reintentos para lotes ACH por archivo."
></app-page-header>

<section class="card toolbar">
  <form class="search-row" [formGroup]="filtrosForm" (ngSubmit)="searchByBatchId()">
    <div class="field">
      <label for="batchId">Identificador del lote</label>
      <input id="batchId" type="text" formControlName="batchId" (input)="onBatchIdInput($any($event.target).value)" placeholder="GUID del lote" />
    </div>
    <ui-boton texto="Agregar al seguimiento" variante="primario" [deshabilitado]="isLoading()" (accion)="searchByBatchId()"></ui-boton>
    <ui-boton texto="Actualizar" variante="contorno" [deshabilitado]="isLoading()" (accion)="refreshFromRecent()"></ui-boton>
  </form>

  <div class="field">
    <label for="statusFilter">Estado</label>
    <ui-selector-buscable
      [opciones]="[
        { valor: 'ALL', etiqueta: 'Todos' },
        { valor: '1', etiqueta: 'Cargado' },
        { valor: '2', etiqueta: 'Parseado' },
        { valor: '3', etiqueta: 'Validado' },
        { valor: '4', etiqueta: 'En cola' },
        { valor: '5', etiqueta: 'Procesando' },
        { valor: '6', etiqueta: 'Parcialmente procesado' },
        { valor: '7', etiqueta: 'Completado' },
        { valor: '8', etiqueta: 'Fallido' },
        { valor: '9', etiqueta: 'Reintentando' },
        { valor: '10', etiqueta: 'Cancelado' }
      ]"
      [formControl]="filtrosForm.controls.status"
      placeholderBusqueda="Buscar estado"
    ></ui-selector-buscable>
  </div>
</section>

<section class="kpi-grid">
  <article class="card"><small>Lotes</small><strong>{{ totals().batches }}</strong></article>
  <article class="card"><small>Registros</small><strong>{{ totals().records }}</strong></article>
  <article class="card"><small>Exitosos</small><strong class="ok">{{ totals().succeeded }}</strong></article>
  <article class="card"><small>Fallidos</small><strong class="ko">{{ totals().failed }}</strong></article>
</section>

<ui-grilla-empresarial
  [columnas]="columnDefs"
  [datos]="filteredRows()"
  [cargando]="isLoading()"
  [paginacion]="true"
  [tamanoPagina]="15"
  [tituloVacio]="'Sin lotes en seguimiento'"
  [mensajeVacio]="'Agregue un identificador de lote o registre lotes desde la pantalla de carga.'"
  [seleccionFilas]="{ mode: 'singleRow' }"
></ui-grilla-empresarial>
