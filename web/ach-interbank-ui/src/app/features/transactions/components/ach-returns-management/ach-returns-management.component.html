<app-page-header title="Gestión de Devoluciones ACH" description="Seleccione un ciclo, marque transacciones y genere el archivo .RET"></app-page-header>

<div class="toolbar">
  <label>
    Ciclo operativo
    <ui-selector-buscable
      [opciones]="cycleOptions"
      [formControl]="filtrosForm.controls.cycleId"
      placeholderBusqueda="Buscar ciclo operativo"
    ></ui-selector-buscable>
  </label>

  <ui-boton texto="Consultar" variante="primario" [deshabilitado]="loading" (accion)="loadTransactions()"></ui-boton>
  <ui-boton texto="Asignar causal / Generar" variante="contorno" [deshabilitado]="loading || rows.length === 0" (accion)="openReasonModal()"></ui-boton>
</div>

<ui-grilla-empresarial
  [columnas]="columnDefs"
  [datos]="rows"
  [cargando]="loading"
  [error]="!!loadError"
  [mensajeError]="loadError"
  [paginacion]="true"
  [tamanoPagina]="20"
  [tituloVacio]="'No hay devoluciones registradas'"
  [mensajeVacio]="'No hay devoluciones registradas para el ciclo seleccionado.'"
  [seleccionFilas]="rowSelection"
  (reintentar)="loadTransactions()"
  (seleccionCambio)="onSelectionChanged($event)"
></ui-grilla-empresarial>

<div class="modal-backdrop" *ngIf="showReasonModal">
  <div class="modal">
    <h3>Asignar causal de devolución</h3>
    <label>
      Causal (Rxx)
      <ui-selector-buscable
        [opciones]="reasonOptions"
        [formControl]="devolucionForm.controls.reasonCode"
        placeholderBusqueda="Buscar causal de devolución"
      ></ui-selector-buscable>
    </label>

    <p>Transacciones seleccionadas: {{ selectedRows.size }}</p>

    <div class="actions">
      <ui-boton texto="Cancelar" variante="contorno" [deshabilitado]="loading" (accion)="closeReasonModal()"></ui-boton>
      <ui-boton texto="Generar archivo NACHA-M (.RET)" variante="primario" [deshabilitado]="loading" (accion)="generateFile()"></ui-boton>
    </div>
  </div>
</div>
