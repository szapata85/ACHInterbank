<app-page-header title="Gestión de Devoluciones ACH" description="Seleccione un ciclo, marque transacciones y genere el archivo .RET"></app-page-header>

<div class="toolbar">
  <label>
    Ciclo operativo
    <ui-selector-buscable
      [opciones]="cycleOptions"
      [formControl]="filtrosForm.controls.cycleId"
      placeholderBusqueda="Buscar ciclo operativo"
    ></ui-selector-buscable>
  </label>

  <button type="button" class="btn btn-primary" (click)="loadTransactions()" [disabled]="loading">Consultar</button>
  <button type="button" class="btn btn-outline" (click)="openReasonModal()" [disabled]="loading || rows.length === 0">Asignar causal / Generar</button>
</div>

<ui-grilla-empresarial
  [columnas]="columnDefs"
  [datos]="rows"
  [cargando]="loading"
  [paginacion]="true"
  [tamanoPagina]="20"
  [tituloVacio]="'Sin transacciones'"
  [mensajeVacio]="'No hay transacciones cargadas para devolución.'"
  [seleccionFilas]="{ mode: 'multiRow' }"
  (seleccionCambio)="onSelectionChanged($event)"
></ui-grilla-empresarial>

<div class="modal-backdrop" *ngIf="showReasonModal">
  <div class="modal">
    <h3>Asignar causal de devolución</h3>
    <label>
      Causal (Rxx)
      <ui-selector-buscable
        [opciones]="reasonOptions"
        [formControl]="devolucionForm.controls.reasonCode"
        placeholderBusqueda="Buscar causal de devolución"
      ></ui-selector-buscable>
    </label>

    <p>Transacciones seleccionadas: {{ selectedRows.size }}</p>

    <div class="actions">
      <button type="button" class="btn btn-outline" (click)="closeReasonModal()" [disabled]="loading">Cancelar</button>
      <button type="button" class="btn btn-primary" (click)="generateFile()" [disabled]="loading">Generar Archivo NACHA-M (.RET)</button>
    </div>
  </div>
</div>
