<app-page-header
  title="Cargar archivo NACHA-M"
  description="Sube archivos NACHA-M enviados por cámaras compensadoras externas y consulta el detalle cargado."
></app-page-header>

<section class="upload-card">
  <form [formGroup]="form" (ngSubmit)="upload()" novalidate>
    <label class="file-input">
      <span>Archivo NACHA-M *</span>
      <input type="file" (change)="onFileSelected($event)" />
      <small class="muted" *ngIf="fileName; else emptyFile">Archivo seleccionado: {{ fileName }}</small>
      <ng-template #emptyFile>
        <small class="muted">Selecciona el archivo NACHA-M a cargar.</small>
      </ng-template>
      <app-error-message [control]="form.get('file')"></app-error-message>
    </label>

    <div class="actions">
      <button type="submit" [disabled]="uploading">{{ uploading ? 'Cargando...' : 'Cargar archivo' }}</button>
      <button type="button" class="btn btn-outline" routerLink="/transactions">Cancelar</button>
    </div>
  </form>
</section>

<section class="upload-card records-card">
  <div class="records-header">
    <h3>Información cargada de archivos NACHA-M</h3>
    <small class="muted">Filtra y visualiza los registros persistidos en base de datos.</small>
  </div>

  <form class="filters-grid" [formGroup]="filtersForm" (ngSubmit)="searchRecords()">
    <label>
      Originador (Immediate Origin)
      <input type="text" formControlName="immediateOrigin" placeholder="Ej: 02100002" />
    </label>

    <label>
      Receptor (Immediate Destination)
      <input type="text" formControlName="immediateDestination" placeholder="Ej: 02100001" />
    </label>

    <label>
      Referencia
      <input type="text" formControlName="referenceCode" placeholder="Código de referencia" />
    </label>

    <label>
      Ciclo ACH
      <input type="text" formControlName="achCycleId" placeholder="Ej: CH01-20260108-C1" />
    </label>

    <label>
      Fecha de creación archivo
      <input type="date" formControlName="fileCreationDate" />
    </label>

    <div class="actions">
      <button type="submit" [disabled]="loadingRecords">{{ loadingRecords ? 'Buscando...' : 'Buscar' }}</button>
      <button type="button" class="btn btn-outline" (click)="clearFilters()">Limpiar</button>
    </div>
  </form>

  <ui-grilla-empresarial
    [columnas]="columnDefs"
    [datos]="records"
    [cargando]="loadingRecords"
    [paginacion]="true"
    [tamanoPagina]="10"
    [tituloVacio]="'Sin registros NACHA-M'"
    [mensajeVacio]="'No se encontraron registros NACHA-M con los filtros seleccionados.'"
    [mensajeCargando]="'Cargando información...'"
    [seleccionFilas]="{ mode: 'singleRow' }"
  ></ui-grilla-empresarial>
</section>
