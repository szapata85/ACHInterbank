<app-page-header title="Transacciones" description="Consulta y agrupa las transacciones por lote"></app-page-header>

<div class="actions">
  <form class="filters" [formGroup]="filtrosForm" (ngSubmit)="applyFilters()">
    <div class="filter-field">
      <label for="date">Fecha</label>
      <input id="date" type="date" formControlName="selectedDate" (change)="onDateChange()" />
    </div>

    <div class="filter-field">
      <label for="clearingHouse">Cámara compensadora</label>
      <ui-selector-buscable
        [opciones]="clearingHouses.map(house => ({ valor: house.id, etiqueta: house.name }))"
        [formControl]="filtrosForm.controls.selectedClearingHouseId"
        placeholderBusqueda="Buscar cámara"
      ></ui-selector-buscable>
    </div>

    <div class="filter-field">
      <label for="cycle">Ciclo</label>
      <ui-selector-buscable
        [opciones]="cycles.map(cycle => ({ valor: cycle.id, etiqueta: cycle.label }))"
        [formControl]="filtrosForm.controls.selectedCycleId"
        placeholderBusqueda="Buscar ciclo"
      ></ui-selector-buscable>
    </div>

    <button type="submit" class="btn btn-outline" [disabled]="loading">Aplicar</button>
  </form>

  <div class="action-buttons">
    <button type="button" class="btn btn-outline" (click)="createBulk()">Carga masiva por archivo</button>
    <button type="button" class="btn btn-outline" (click)="openBulkTracking()">Seguimiento lotes</button>
    <button type="button" class="btn btn-primary" (click)="createNew()">Crear transacción</button>
  </div>
</div>

  <div class="return-filters">
    <button type="button" class="btn btn-outline" (click)="setReturnView('all')" [disabled]="loading || returnView === 'all'">Todas</button>
    <button type="button" class="btn btn-outline" (click)="setReturnView('received')" [disabled]="loading || returnView === 'received'">Devoluciones recibidas</button>
    <button type="button" class="btn btn-outline" (click)="setReturnView('sent')" [disabled]="loading || returnView === 'sent'">Devoluciones enviadas</button>
  </div>

<div class="column-manager" aria-label="Selector de columnas para la grilla">
  <details>
    <summary>Columnas visibles (útil en móvil)</summary>
    <div class="column-manager__options">
      <label *ngFor="let option of columnOptions" [class.disabled]="!canToggleColumn(option.field)">
        <input
          type="checkbox"
          [checked]="isColumnVisible(option.field)"
          [disabled]="!canToggleColumn(option.field)"
          (change)="toggleColumn(option.field, $any($event.target).checked)"
        />
        <span>{{ option.label }}</span>
      </label>
    </div>
  </details>
</div>

<div class="group-list" *ngIf="groups.length > 0; else emptyState">
  <section class="batch" *ngFor="let group of groups">
    <header class="batch__header">
      <div class="batch__titles">
        <p class="batch__eyebrow">{{ group.batchLabel }}</p>
        <h3>Fecha efectiva: {{ group.batchDate }}</h3>
      </div>
      <span class="badge">{{ group.items.length }} transacciones</span>
    </header>

    <ui-grilla-empresarial
      [columnas]="columnDefs"
      [datos]="group.items"
      [cargando]="loading"
      [error]="false"
      [paginacion]="true"
      [tamanoPagina]="10"
      [seleccionFilas]="rowSelection"
      [mensajeVacio]="'No hay transacciones para este lote.'"
      [placeholderBusqueda]="'Buscar por cualquier campo del lote...'"
    ></ui-grilla-empresarial>
  </section>
</div>

<ng-template #emptyState>
  <div class="empty">
    <p *ngIf="!loading">No hay transacciones registradas.</p>
    <p *ngIf="loading">Cargando transacciones...</p>
  </div>
</ng-template>
