<app-page-header title="Transacciones" description="Consulta y agrupa las transacciones por lote"></app-page-header>

<div class="actions">
  <div class="filters">
    <div class="filter-field">
      <label for="date">Fecha</label>
      <input id="date" type="date" [(ngModel)]="selectedDate" (ngModelChange)="onDateChange()" />
    </div>

    <div class="filter-field">
      <label for="clearingHouse">Cámara compensadora</label>
      <select id="clearingHouse" [(ngModel)]="selectedClearingHouseId" (ngModelChange)="onClearingHouseChange()">
        <option [ngValue]="null">Todas las cámaras</option>
        <option *ngFor="let house of clearingHouses" [ngValue]="house.id">{{ house.name }}</option>
      </select>
    </div>

    <div class="filter-field">
      <label for="cycle">Ciclo</label>
      <select id="cycle" [(ngModel)]="selectedCycleId">
        <option [ngValue]="null">Todos los ciclos</option>
        <option *ngFor="let cycle of cycles" [ngValue]="cycle.id">{{ cycle.label }}</option>
      </select>
    </div>

    <button type="button" class="ghost" (click)="applyFilters()" [disabled]="loading">Aplicar</button>
  </div>

  <button type="button" (click)="createNew()">Crear transacción</button>
</div>

<div class="group-list" *ngIf="groups.length > 0; else emptyState">
  <section class="batch" *ngFor="let group of groups">
    <header class="batch__header">
      <div class="batch__titles">
        <p class="batch__eyebrow">{{ group.batchLabel }}</p>
        <h3>Fecha efectiva: {{ group.batchDate }}</h3>
      </div>
      <span class="badge">{{ group.items.length }} transacciones</span>
    </header>

    <ag-grid-angular
      class="ag-theme-alpine transactions-grid"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [rowData]="group.items"
      [domLayout]="'autoHeight'"
      [overlayNoRowsTemplate]="noRowsTemplate"
      [overlayLoadingTemplate]="loadingTemplate"
      [rowSelection]="rowSelection"
      [animateRows]="true"
      [suppressCellFocus]="true"
    ></ag-grid-angular>
  </section>
</div>

<ng-template #emptyState>
  <div class="empty">
    <p *ngIf="!loading">No hay transacciones registradas.</p>
    <p *ngIf="loading">Cargando transacciones...</p>
  </div>
</ng-template>
