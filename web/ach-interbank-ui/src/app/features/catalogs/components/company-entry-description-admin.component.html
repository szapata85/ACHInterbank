<app-page-header
  title="Conceptos de lote"
  subtitle="Administra el catálogo de conceptos para la descripción de entrada de la empresa.">
</app-page-header>

<section class="card form-card">
  <h3>{{ editingId ? 'Editar registro' : 'Nuevo registro' }}</h3>
  <form [formGroup]="form" (ngSubmit)="submit()" class="form-grid" novalidate>
    <label>
      <span>Término *</span>
      <input type="text" formControlName="term" maxlength="12" />
      <app-error-message [control]="form.get('term')"></app-error-message>
    </label>

    <label>
      <span>Código SEC *</span>
      <select formControlName="standardEntryClassCode">
        <option value="PPD">PPD</option>
        <option value="CCD">CCD</option>
      </select>
      <app-error-message [control]="form.get('standardEntryClassCode')"></app-error-message>
    </label>

    <label>
      <span>Estado</span>
      <select formControlName="isActive">
        <option [ngValue]="true">Activo</option>
        <option [ngValue]="false">Inactivo</option>
      </select>
      <app-error-message [control]="form.get('isActive')"></app-error-message>
    </label>

    <label class="full-width">
      <span>Descripción *</span>
      <input type="text" formControlName="description" maxlength="255" />
      <app-error-message [control]="form.get('description')"></app-error-message>
    </label>

    <div class="actions full-width">
      <button type="submit" [disabled]="saving || loading">{{ editingId ? 'Actualizar' : 'Crear' }}</button>
      <button type="button" class="btn btn-outline" (click)="cancelEdit()" [disabled]="saving">Cancelar</button>
    </div>
  </form>
</section>

<section class="card">
  <ui-grilla-empresarial
    [columnas]="columnas"
    [datos]="filasGrilla"
    [cargando]="loading"
    [error]="false"
    [tamanoPagina]="10"
    [mensajeVacio]="'No hay registros.'"
    [mensajeCargando]="'Cargando información...'"
  ></ui-grilla-empresarial>

  <ng-template #emptyState>
    <p class="muted" *ngIf="loading">Cargando...</p>
    <p class="muted" *ngIf="!loading">No hay registros.</p>
  </ng-template>
</section>
