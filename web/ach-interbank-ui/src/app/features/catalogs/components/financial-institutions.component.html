<section class="card">
  <div class="header">
    <div>
      <p class="eyebrow">Catálogos</p>
      <h2>Instituciones financieras</h2>
      <p class="lede">Administra las instituciones configuradas en ACH, incluyendo su estado y datos de enrutamiento.</p>
    </div>
    <div class="actions">
      <ui-boton texto="Recargar" variante="contorno" icono="refresh" (accion)="loadInstitutions()" [deshabilitado]="loading || saving"></ui-boton>
      <ui-boton texto="Nueva institución" icono="add" (accion)="startCreate()" [deshabilitado]="saving"></ui-boton>
    </div>
  </div>

  <ui-grilla-empresarial
    [columnas]="columnDefs"
    [datos]="institutions"
    [cargando]="loading"
    [error]="false"
    [tamanoPagina]="pageSize"
    [mensajeVacio]="'No hay instituciones registradas.'"
    [mensajeCargando]="'Cargando instituciones...'"
    [placeholderBusqueda]="'Buscar institución por nombre, ruta o estado'"
  ></ui-grilla-empresarial>

  <div class="empty" *ngIf="!loading && institutions.length === 0">
    <p>No hay instituciones registradas.</p>
    <ui-boton texto="Agregar primera institución" icono="add_circle" (accion)="startCreate()" [deshabilitado]="saving"></ui-boton>
  </div>
</section>

<section class="card" *ngIf="showForm">
  <h3>{{ editing ? 'Editar institución' : 'Nueva institución' }}</h3>
  <form [formGroup]="form" (ngSubmit)="save()" class="form-grid">
    <label>
      Nombre
      <input type="text" formControlName="name" maxlength="100" />
      <app-error-message [control]="form.get('name')"></app-error-message>
    </label>

    <label>
      Código de ruta
      <input type="text" formControlName="routingNumber" maxlength="9" />
      <app-error-message [control]="form.get('routingNumber')"></app-error-message>
    </label>

    <label>
      Código de tránsito
      <input type="text" formControlName="transitCode" maxlength="4" />
      <app-error-message [control]="form.get('transitCode')"></app-error-message>
    </label>

    <label>
      Dígito de control
      <input type="text" formControlName="checkDigit" maxlength="1" readonly />
      <app-error-message [control]="form.get('checkDigit')"></app-error-message>
    </label>

    <label class="checkbox">
      <input type="checkbox" formControlName="isDefaultSource" />
      <span>Usar como origen por defecto</span>
    </label>

    <label>
      Estado
      <select formControlName="status">
        <option [ngValue]="statusEnum.Active">Activa</option>
        <option [ngValue]="statusEnum.Inactive">Inactiva</option>
      </select>
    </label>

    <div class="form-actions">
      <ui-boton texto="Cancelar" variante="contorno" (accion)="cancelEdit()" [deshabilitado]="saving"></ui-boton>
      <button type="submit" class="btn btn-primary" [disabled]="saving">{{ editing ? 'Actualizar' : 'Guardar' }}</button>
    </div>
  </form>
</section>
