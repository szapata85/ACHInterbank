<section class="card">
  <h2>Instituciones financieras</h2>
  <ui-grilla-empresarial
    [columnas]="columnas"
    [datos]="banks"
    [paginacion]="true"
    [tamanoPagina]="10"
    [error]="false"
  ></ui-grilla-empresarial>
</section>

<section class="card catalog-links">
  <h2>Catálogos de administración</h2>
  <ul>
    <li *ngFor="let catalog of adminCatalogs">
      <a [routerLink]="catalog.route">{{ catalog.label }}</a>
    </li>
  </ul>
</section>
