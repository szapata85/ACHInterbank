<section class="card">
  <h2>Instituciones financieras</h2>
  <table class="table">
    <thead>
      <tr>
        <th>Código</th>
        <th>Nombre</th>
        <th>Tipo</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let bank of banks">
        <td>{{ bank.code }}</td>
        <td>{{ bank.name }}</td>
        <td>{{ bank.type }}</td>
      </tr>
    </tbody>
  </table>
</section>

<section class="card">
  <h2>Causales de devolución ACH</h2>
  <p>Consulta y filtra los códigos de devolución oficiales.</p>
  <button type="button" routerLink="/catalogs/error-codes">Abrir catálogo</button>
</section>
