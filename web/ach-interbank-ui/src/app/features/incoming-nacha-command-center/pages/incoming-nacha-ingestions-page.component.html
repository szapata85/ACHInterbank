<section class="inbound-page">
  <ui-migas-pan [items]="migas"></ui-migas-pan>
  <ui-encabezado-pagina
    titulo="Command Center Inbound NACHA-M"
    descripcion="Monitoreo operativo de ingestas entrantes, correlación de cola dispatch y eventos de procesamiento."
  ></ui-encabezado-pagina>

  <ui-alerta
    tipo="info"
    titulo="Operación segura"
    mensaje="Las acciones manuales se habilitan únicamente desde el backend vía AllowedActions y requieren justificación + idempotency key."
  ></ui-alerta>

  <ui-tarjeta titulo="Filtros de ingesta" subtitulo="Use criterios de búsqueda para focalizar operación y auditoría.">
    <form [formGroup]="filtrosForm" class="filtros-grid">
      <ui-campo-texto etiqueta="CorrelationId" [control]="$any(filtrosForm.controls.correlationId)"></ui-campo-texto>
      <ui-campo-texto etiqueta="Archivo" [control]="$any(filtrosForm.controls.fileName)"></ui-campo-texto>
      <ui-campo-texto etiqueta="Estado ingesta" [control]="$any(filtrosForm.controls.ingestionStatus)"></ui-campo-texto>
      <ui-campo-texto etiqueta="Estado parser" [control]="$any(filtrosForm.controls.parsingStatus)"></ui-campo-texto>
      <ui-campo-numero etiqueta="Página" [control]="$any(filtrosForm.controls.page)"></ui-campo-numero>
      <ui-campo-numero etiqueta="Tamaño" [control]="$any(filtrosForm.controls.pageSize)"></ui-campo-numero>
    </form>
    <div class="acciones">
      <ui-boton texto="Buscar" icono="search" (accion)="buscar()"></ui-boton>
      <ui-boton texto="Limpiar" variante="contorno" icono="filter_alt_off" (accion)="limpiar()"></ui-boton>
      <ui-boton texto="Ver cola dispatch" variante="secundario" icono="queue" (accion)="irACola()"></ui-boton>
    </div>
  </ui-tarjeta>

  <ui-alerta *ngIf="error" tipo="error" titulo="Error de consulta" [mensaje]="error"></ui-alerta>

  <ui-tarjeta [titulo]="'Ingestas (' + totalItems + ')'" subtitulo="Listado operativo de ingestas entrantes NACHA-M.">
    <ui-grilla-empresarial
      [columnas]="columnas"
      [datos]="items"
      [cargando]="cargando"
      tituloVacio="Sin ingestas"
      mensajeVacio="No se encontraron resultados con los filtros actuales."
    ></ui-grilla-empresarial>
  </ui-tarjeta>
</section>
