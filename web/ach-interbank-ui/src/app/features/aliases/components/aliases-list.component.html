<div class="toolbar">
  <form [formGroup]="filterForm" (ngSubmit)="load()" class="filters">
    <input type="text" formControlName="search" placeholder="Alias o cuenta" />
    <input type="text" formControlName="documentNumber" placeholder="Documento" />
    <input type="text" formControlName="phoneNumber" placeholder="Teléfono" />
    <button type="submit">Buscar</button>
    <button type="button" class="btn btn-primary" (click)="create()">Nuevo alias</button>
  </form>
</div>

<div *ngIf="loading" class="loading">Cargando alias...</div>
<div *ngIf="!loading && loadError" class="loading">{{ loadError }}</div>

<ui-grilla-empresarial
  *ngIf="!loading"
  [columnas]="columnas"
  [datos]="filasGrilla"
  [cargando]="loading"
  [error]="false"
  [paginacion]="true"
  [tamanoPagina]="filterForm.value.pageSize || 10"
  [mensajeVacio]="'No hay registros para mostrar'"
  [mensajeCargando]="'Cargando información...'"
></ui-grilla-empresarial>

<div class="pagination">
  <button (click)="changePage(filterForm.value.page! - 1)" [disabled]="filterForm.value.page === 1">Anterior</button>
  <span>Página {{ filterForm.value.page }} de {{ math.ceil(total / (filterForm.value.pageSize || 10)) || 1 }}</span>
  <button
    (click)="changePage(filterForm.value.page! + 1)"
    [disabled]="filterForm.value.page! >= math.ceil(total / (filterForm.value.pageSize || 10))"
  >
    Siguiente
  </button>
</div>
