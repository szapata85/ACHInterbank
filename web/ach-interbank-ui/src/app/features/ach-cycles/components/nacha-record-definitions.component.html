<section class="page" data-testid="nacha-definitions-page">
  <app-page-header
    title="NACHA Config - Records"
    subtitle="Vista read-only oficial basada en nacha-config profiles."
  ></app-page-header>

  <section class="legacy-banner" role="status" aria-label="Aviso compatibilidad NACHA-M">
    <strong>Ruta de compatibilidad</strong>
    <span>Ruta de compatibilidad. La fuente oficial NACHA-M es nacha-config profiles. Legacy layouts/definitions no son fuente oficial.</span>
    <a routerLink="/nacha-config-admin/perfiles">Perfiles oficiales</a>
  </section>

  <ui-estado-error
    *ngIf="loadError"
    titulo="No fue posible cargar records NACHA Config"
    [mensaje]="loadError"
    (reintentar)="load()"
  ></ui-estado-error>

  <app-table
    *ngIf="!loadError"
    [columns]="columns"
    [data]="profiles"
    [loading]="loading"
    [pageSize]="profiles.length || 10"
    [total]="profiles.length"
  >
    <ng-template #rowActions let-row>
      <a class="btn btn-outline" [routerLink]="['/nacha-config-admin/perfiles', row.profileId]">Ver perfil</a>
    </ng-template>
  </app-table>

  <ui-estado-vacio
    *ngIf="!loading && !loadError && profiles.length === 0"
    titulo="Sin records oficiales"
    mensaje="No hay profiles oficiales disponibles para mostrar records en esta ruta de compatibilidad."
  ></ui-estado-vacio>
</section>
