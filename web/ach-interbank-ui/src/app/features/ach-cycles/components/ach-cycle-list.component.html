<div class="toolbar">
  <form [formGroup]="filterForm" (ngSubmit)="load()" class="filters">
    <select formControlName="clearingHouseId">
      <option value="">Todas las cámaras</option>
      <option *ngFor="let ch of clearingHouses" [value]="ch.id">{{ ch.name }}</option>
    </select>
    <input type="date" formControlName="date" />
    <button type="submit">Filtrar</button>
    <button type="button" class="primary" (click)="create()">Nuevo ciclo</button>
  </form>
</div>

<table class="table">
  <thead>
    <tr>
      <th>Cámara</th>
      <th>Fecha</th>
      <th>Inicio</th>
      <th>Fin</th>
      <th>Estado</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let cycle of cycles">
      <td>{{ cycle.clearingHouseName }}</td>
      <td>{{ cycle.date }}</td>
      <td>{{ cycle.startTime }}</td>
      <td>{{ cycle.endTime }}</td>
      <td>{{ cycle.status }}</td>
      <td><button type="button" (click)="edit(cycle)">Editar</button></td>
    </tr>
  </tbody>
</table>

<div class="pagination">
  <button (click)="changePage(filterForm.value.page! - 1)" [disabled]="filterForm.value.page === 1">Anterior</button>
  <span>Página {{ filterForm.value.page }} de {{ Math.ceil(total / (filterForm.value.pageSize || 10)) || 1 }}</span>
  <button
    (click)="changePage(filterForm.value.page! + 1)"
    [disabled]="filterForm.value.page! >= Math.ceil(total / (filterForm.value.pageSize || 10))"
  >
    Siguiente
  </button>
</div>
