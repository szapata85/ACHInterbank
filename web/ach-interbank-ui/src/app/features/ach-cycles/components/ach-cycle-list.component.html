<app-page-header title="Ciclos de operación" subtitle="Ciclos y reglas de procesamiento" [actionsTemplate]="headerActions"></app-page-header>

<nav class="cycle-tabs" aria-label="Secciones de configuración de ciclos">
  <a routerLink="/ach-cycles" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Ciclos de operación</a>
  <a
    [routerLink]="filterForm.controls.clearingHouseId.value
      ? ['/clearing-houses', filterForm.controls.clearingHouseId.value, 'cycles']
      : ['/clearing-houses']"
    routerLinkActive="active"
  >Reglas de procesamiento</a>
</nav>

<div class="toolbar">
  <form [formGroup]="filterForm" (ngSubmit)="submit()" class="filters">
    <mat-form-field appearance="outline">
      <mat-label>Cámara</mat-label>
      <mat-select formControlName="clearingHouseId">
        <mat-option [value]="null">Todas las cámaras</mat-option>
        <mat-option *ngFor="let ch of clearingHouses" [value]="ch.id">{{ ch.name }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Desde</mat-label>
      <input matInput type="date" formControlName="startDate" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Hasta</mat-label>
      <input matInput type="date" formControlName="endDate" />
    </mat-form-field>

    <button mat-flat-button type="submit">Aplicar filtros</button>
  </form>
</div>

<app-table
  [columns]="[
    { key: 'clearingHouseName', label: 'Cámara' },
    { key: 'dateText', label: 'Fecha' },
    { key: 'startText', label: 'Inicio' },
    { key: 'endText', label: 'Fin' },
    { key: 'statusText', label: 'Estado' }
  ]"
  [data]="cycles"
  [page]="filterForm.value.page!"
  [pageSize]="filterForm.value.pageSize!"
  [total]="total"
  [loading]="loading"
  [error]="loadError"
  loadingMessage="Cargando ciclos ACH..."
  emptyTitle="Sin ciclos ACH"
  emptyMessage="No hay ciclos que coincidan con los filtros actuales."
  errorMessage="No fue posible cargar los ciclos ACH."
  [rowActions]="rowActions"
  (pageChange)="changePage($event)"
></app-table>

<ng-template #rowActions let-cycle>
  <button mat-stroked-button type="button" (click)="edit(cycle)">Editar</button>
</ng-template>

<ng-template #headerActions>
  <button mat-stroked-button type="button" (click)="goToExport()">Exportar archivo NACHA-M</button>
  <button mat-flat-button type="button" (click)="create()">Nuevo ciclo</button>
</ng-template>

<p class="muted">Actualizado: {{ today | dateFormat }}</p>
