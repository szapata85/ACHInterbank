<section class="cycle-form-page">
  <app-page-header
    [title]="isEdit ? 'Editar ciclo' : 'Nuevo ciclo'"
    subtitle="Programación del ciclo ACH"
  ></app-page-header>

  <form [formGroup]="form" (ngSubmit)="save()" class="cycle-form-card">
    <div class="form-grid">
      <div class="form-field">
        <mat-form-field appearance="outline">
          <mat-label>Cámara</mat-label>
          <mat-select formControlName="clearingHouseId" (selectionChange)="configurationContextChanged()">
            <mat-option [value]="null">Seleccione</mat-option>
            <mat-option *ngFor="let ch of clearingHouses" [value]="ch.id">{{ ch.name }}</mat-option>
          </mat-select>
        </mat-form-field>
        <app-error-message [control]="form.get('clearingHouseId')"></app-error-message>
      </div>

      <div class="form-field">
        <mat-form-field appearance="outline">
          <mat-label>Fecha operativa</mat-label>
          <input matInput type="date" formControlName="processingDate" (change)="configurationContextChanged()" />
        </mat-form-field>
        <app-error-message [control]="form.get('processingDate')"></app-error-message>
      </div>

      <div class="form-field field-span">
        <mat-form-field appearance="outline">
          <mat-label>Configuración de ciclo</mat-label>
          <mat-select
            formControlName="clearingHouseCycleConfigId"
            [attr.aria-busy]="isLoadingConfigurations"
          >
            <mat-option [value]="null">Seleccione una configuración vigente</mat-option>
            <mat-option *ngFor="let config of configurations" [value]="config.id">
              {{ configurationLabel(config) }}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <app-error-message [control]="form.get('clearingHouseCycleConfigId')"></app-error-message>

        <ui-estado-carga
          *ngIf="isLoadingConfigurations"
          class="configuration-state"
          mensaje="Cargando configuraciones vigentes..."
        ></ui-estado-carga>

        <small
          *ngIf="!isLoadingConfigurations && form.value.clearingHouseId && form.value.processingDate && configurations.length === 0"
          class="empty-configurations"
        >
          No hay configuraciones activas y vigentes para la cámara y fecha seleccionadas.
        </small>
      </div>

      <mat-checkbox formControlName="rescheduleOnHoliday" class="field-span holiday-option">
        Reprogramar si la fecha es festiva
      </mat-checkbox>
    </div>

    <div *ngIf="errorMessage" class="form-error" role="alert">
      <ui-estado-error
        titulo="No fue posible completar la operación"
        [mensaje]="errorMessage || ''"
        [mostrarReintentar]="false"
      ></ui-estado-error>
    </div>

    <div class="actions">
      <button mat-stroked-button type="button" routerLink="/ach-cycles">Cancelar</button>
      <button mat-flat-button type="submit" [disabled]="isSaving">
        {{ isSaving ? 'Guardando…' : 'Guardar' }}
      </button>
    </div>
  </form>
</section>
