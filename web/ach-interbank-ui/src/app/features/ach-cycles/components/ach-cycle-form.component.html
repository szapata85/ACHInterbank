<div class="card">
  <h2>{{ isEdit ? 'Editar ciclo' : 'Nuevo ciclo' }}</h2>

  <form [formGroup]="form" (ngSubmit)="save()" class="form-grid">
    <label>
      Cámara
      <select formControlName="clearingHouseId" (change)="configurationContextChanged()">
        <option [ngValue]="null">Seleccione</option>
        <option *ngFor="let ch of clearingHouses" [ngValue]="ch.id">{{ ch.name }}</option>
      </select>
      <app-error-message [control]="form.get('clearingHouseId')"></app-error-message>
    </label>

    <label>
      Fecha operativa
      <input type="date" formControlName="processingDate" (change)="configurationContextChanged()" />
      <app-error-message [control]="form.get('processingDate')"></app-error-message>
    </label>

    <label>
      Configuración de ciclo
      <select formControlName="clearingHouseCycleConfigId" [attr.aria-busy]="isLoadingConfigurations">
        <option [ngValue]="null">Seleccione una configuración vigente</option>
        <option *ngFor="let config of configurations" [ngValue]="config.id">
          {{ configurationLabel(config) }}
        </option>
      </select>
      <app-error-message [control]="form.get('clearingHouseCycleConfigId')"></app-error-message>
      <small *ngIf="!isLoadingConfigurations && form.value.clearingHouseId && form.value.processingDate && configurations.length === 0">
        No hay configuraciones activas y vigentes para la cámara y fecha seleccionadas.
      </small>
    </label>

    <label>
      <input type="checkbox" formControlName="rescheduleOnHoliday" />
      Reprogramar si la fecha es festiva
    </label>

    <p *ngIf="errorMessage" class="error" role="alert">{{ errorMessage }}</p>

    <div class="actions">
      <button type="button" routerLink="/ach-cycles">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="isSaving">
        {{ isSaving ? 'Guardando…' : 'Guardar' }}
      </button>
    </div>
  </form>
</div>
