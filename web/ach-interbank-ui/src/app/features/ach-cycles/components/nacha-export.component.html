<app-page-header
  title="Exportar archivos NACHA-M"
  subtitle="Descarga los archivos planos por ciclo ejecutado"
  [actionsTemplate]="headerActions"
></app-page-header>

<div class="toolbar">
  <form [formGroup]="filterForm" (ngSubmit)="submit()" class="filters">
    <select formControlName="clearingHouseId">
      <option [ngValue]="null">Todas las cámaras</option>
      <option *ngFor="let ch of clearingHouses" [ngValue]="ch.id">{{ ch.name }}</option>
    </select>
    <label>
      Desde
      <input type="date" formControlName="startDate" />
    </label>
    <label>
      Hasta
      <input type="date" formControlName="endDate" />
    </label>
    <button type="submit">Filtrar</button>
  </form>
</div>

<div class="export-wrapper">
  <ui-grilla-empresarial
    [columnas]="columnas"
    [datos]="cycles"
    [cargando]="loading"
    [paginacion]="cycles.length > 10"
    [tamanoPagina]="10"
    [mensajeVacio]="'No hay ciclos disponibles para exportar.'"
    [mensajeCargando]="'Cargando ciclos con transacciones...'"
    (grillaLista)="onGrillaLista($event)"
  ></ui-grilla-empresarial>
</div>

<ng-template #headerActions>
  <a routerLink="/ach-cycles" class="link">Volver a ciclos</a>
</ng-template>
