<mat-sidenav-container
  class="shell-container"
  [class.mobile-shell]="isMobileViewport"
  [class.sidebar-compact]="isDesktopCompact && !isMobileViewport"
  [hasBackdrop]="isMobileViewport"
  autosize
>
  <mat-sidenav
    id="primary-navigation"
    class="primary-sidenav"
    [class.compact]="isDesktopCompact && !isMobileViewport"
    [mode]="isMobileViewport ? 'over' : 'side'"
    [opened]="drawerOpened"
    [autoFocus]="isMobileViewport"
    (openedChange)="onDrawerOpenedChange($event)"
    (closedStart)="onDrawerClosed()"
    role="navigation"
    aria-label="Menú principal"
  >
    <div class="sidenav-panel">
      <div class="brand" *ngIf="branding$ | async as branding">
        <div class="logo" [class.with-image]="branding.privateLogo">
          <ng-container *ngIf="branding.privateLogo; else defaultPrivateLogo">
            <img [src]="branding.privateLogo" alt="" />
          </ng-container>
          <ng-template #defaultPrivateLogo>ACH</ng-template>
        </div>
        <div class="brand-copy">
          <p class="brand-title">ACH Interbank</p>
          <small data-ui-text="functional">Portal administrativo</small>
        </div>
      </div>

      <div class="navigation">
        <mat-nav-list aria-label="Opciones de navegación">
          <ng-container
            *ngTemplateOutlet="menuTree; context: { $implicit: menuItems }"
          ></ng-container>
        </mat-nav-list>

        <div class="navigation-status" *ngIf="menuLoadError" role="status" aria-live="polite">
          <mat-icon aria-hidden="true">warning</mat-icon>
          <span>{{ menuLoadError }}</span>
        </div>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="shell-main">
    <mat-toolbar class="shell-toolbar" role="banner">
      <div class="toolbar-leading">
        <button
          mat-icon-button
          class="menu-toggle"
          type="button"
          [attr.aria-label]="navigationToggleLabel"
          [attr.aria-controls]="'primary-navigation'"
          [attr.aria-expanded]="isNavigationExpanded"
          [matTooltip]="navigationToggleLabel"
          (click)="toggleNavigation()"
        >
          <svg
            class="menu-toggle-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M4 6.5h16M4 12h16M4 17.5h16"></path>
          </svg>
        </button>

        <div class="page-meta">
          <h1 class="page-title">{{ pageTitle }}</h1>
          <nav class="breadcrumbs" aria-label="Ruta de navegación" *ngIf="breadcrumbs.length">
            <ng-container *ngFor="let crumb of breadcrumbs; let last = last">
              <a *ngIf="!last" [routerLink]="crumb.url">{{ crumb.label }}</a>
              <span *ngIf="last" aria-current="page">{{ crumb.label }}</span>
              <span *ngIf="!last" class="divider" aria-hidden="true">/</span>
            </ng-container>
          </nav>
        </div>
      </div>

      <span class="toolbar-spacer"></span>

      <div class="user" *ngIf="user$ | async as user">
        <div class="user-info">
          <span class="name">{{ user.fullName }}</span>
          <small>{{ user.roles?.join(', ') || 'Usuario' }}</small>
        </div>
        <button
          mat-stroked-button
          class="logout-button"
          type="button"
          aria-label="Cerrar sesión"
          matTooltip="Cerrar sesión"
          (click)="logout()"
        >
          <mat-icon aria-hidden="true">logout</mat-icon>
          <span class="logout-label">Salir</span>
        </button>
      </div>
    </mat-toolbar>

    <main class="content" id="main-content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>

<ng-template #menuTree let-items>
  <ng-container *ngFor="let item of items; trackBy: trackByMenuItem">
    <div
      class="nav-node"
      [class.branch-active]="activeItemIds.has(item.id)"
      [attr.data-menu-node-id]="item.id"
    >
      <ng-container *ngIf="item.children?.length; else navigableMenuItem">
        <button
          mat-list-item
          type="button"
          class="nav-item nav-parent"
          [class.active]="activeItemIds.has(item.id)"
          [attr.data-menu-item-id]="item.id"
          [attr.aria-expanded]="isItemExpanded(item)"
          [attr.aria-controls]="'submenu-' + item.id"
          [matTooltip]="item.label"
          [matTooltipDisabled]="!isDesktopCompact || isMobileViewport"
          matTooltipPosition="after"
          (click)="toggleSubmenu(item)"
        >
          <app-ui-icon
            *ngIf="item.icon"
            matListItemIcon
            class="nav-icon"
            [name]="item.icon"
          ></app-ui-icon>
          <span matListItemTitle class="nav-label">{{ item.label }}</span>
          <span
            matListItemMeta
            class="expand-icon"
            [class.expanded]="isItemExpanded(item)"
            aria-hidden="true"
          ></span>
        </button>

        <div
          *ngIf="isItemExpanded(item) && (!isDesktopCompact || isMobileViewport)"
          class="nav-children"
          [id]="'submenu-' + item.id"
          role="group"
          [attr.aria-label]="'Submenú de ' + item.label"
        >
          <ng-container
            *ngTemplateOutlet="menuTree; context: { $implicit: item.children }"
          ></ng-container>
        </div>
      </ng-container>

      <ng-template #navigableMenuItem>
        <a
          mat-list-item
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="item.exact ? exactRouteMatch : subsetRouteMatch"
          ariaCurrentWhenActive="page"
          [attr.data-menu-item-id]="item.id"
          [matTooltip]="item.label"
          [matTooltipDisabled]="!isDesktopCompact || isMobileViewport"
          matTooltipPosition="after"
          (click)="onNavItemSelected()"
        >
          <app-ui-icon
            *ngIf="item.icon"
            matListItemIcon
            class="nav-icon"
            [name]="item.icon"
          ></app-ui-icon>
          <span matListItemTitle class="nav-label">{{ item.label }}</span>
        </a>
      </ng-template>
    </div>
  </ng-container>
</ng-template>
