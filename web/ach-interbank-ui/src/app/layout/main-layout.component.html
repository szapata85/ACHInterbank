<div class="layout" [class.menu-open]="isMenuOpen" [class.sidebar-collapsed]="isSidebarCollapsed">
  <div class="backdrop" *ngIf="isMenuOpen" (click)="closeMenu()" aria-hidden="true"></div>

  <aside
    class="sidebar"
    [class.open]="isMenuOpen"
    [class.collapsed]="isSidebarCollapsed"
    role="navigation"
    aria-label="Menú principal"
  >
    <div class="brand" *ngIf="branding$ | async as branding">
      <div class="logo" [class.with-image]="branding.privateLogo">
        <ng-container *ngIf="branding.privateLogo; else defaultPrivateLogo">
          <img [src]="branding.privateLogo" alt="Logo de la aplicación" />
        </ng-container>
        <ng-template #defaultPrivateLogo>ACH</ng-template>
      </div>
      <div class="brand-copy">
        <p class="title">ACH Interbank</p>
        <small>Portal backoffice</small>
      </div>
    </div>

    <nav class="menu">
      <ng-container *ngFor="let item of menuItems">
        <div class="menu-group" [class.has-children]="item.children?.length" [class.expanded]="isItemExpanded(item)">
          <div class="menu-header">
            <a
              [routerLink]="item.children?.length ? null : item.route"
              routerLinkActive="active"
              [routerLinkActiveOptions]="item.exact ? { exact: true } : {}"
              class="menu-item"
              [attr.data-menu-item-id]="item.id"
              [attr.title]="isSidebarCollapsed ? item.label : null"
              [attr.aria-expanded]="item.children?.length ? isItemExpanded(item) : null"
              [attr.aria-controls]="item.children?.length ? 'submenu-' + item.id : null"
              (click)="onMenuItemSelected(item)"
            >
              <app-ui-icon *ngIf="item.icon" [name]="item.icon" class="nav-icon"></app-ui-icon>
              <span class="label">{{ item.label }}</span>
              <span *ngIf="item.children?.length" class="chevron" aria-hidden="true"></span>
            </a>
          </div>

          <div
            *ngIf="item.children?.length"
            class="submenu"
            [class.open]="isItemExpanded(item)"
            [id]="'submenu-' + item.id"
            role="group"
            [attr.aria-label]="'Submenú de ' + item.label"
          >
            <a
              *ngFor="let child of item.children"
              [routerLink]="child.route"
              routerLinkActive="active"
              [routerLinkActiveOptions]="child.exact ? { exact: true } : {}"
              class="submenu-item"
              [attr.data-menu-item-id]="child.id"
              [attr.title]="isSidebarCollapsed ? child.label : null"
              (click)="onNavItemSelected()"
            >
              <app-ui-icon *ngIf="child.icon" [name]="child.icon" class="nav-icon"></app-ui-icon>
              <span class="label">{{ child.label }}</span>
            </a>
          </div>
        </div>
      </ng-container>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar" role="banner">
      <div class="topbar-left">
        <button
          class="menu-toggle"
          type="button"
          [attr.aria-label]="menuToggleLabel"
          [attr.title]="menuToggleLabel"
          [attr.aria-expanded]="isMenuExpanded"
          (click)="toggleMenu()"
        >
          <span class="hamburger" [class.open]="isMenuOpen"></span>
        </button>

        <div class="page-meta">
          <h1 class="page-title">{{ pageTitle }}</h1>
          <nav class="breadcrumbs" aria-label="Breadcrumbs">
            <ng-container *ngFor="let crumb of breadcrumbs; let last = last">
              <a *ngIf="!last" [routerLink]="crumb.url">{{ crumb.label }}</a>
              <span *ngIf="last" aria-current="page">{{ crumb.label }}</span>
              <span *ngIf="!last" class="divider">/</span>
            </ng-container>
          </nav>
        </div>
      </div>

      <div class="user" *ngIf="user$ | async as user">
        <div class="user-info">
          <span class="name">{{ user.fullName }}</span>
          <small>{{ user.roles?.join(', ') || 'Usuario' }}</small>
        </div>
        <button type="button" (click)="logout()">Salir</button>
      </div>
    </header>

    <main class="content" role="main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
