name: achinterbank-postgres-ci

# Autonomous PostgreSQL runtime used by CI and local PostgreSQL E2E checks.
# This file intentionally does not extend docker-compose.yml: the canonical
# local/Portainer stack remains SQL Server based.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ACHInterbank}
      POSTGRES_USER: ${POSTGRES_USER:-example_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria}
    volumes:
      - ach_postgres_ci_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-example_user} -d ${POSTGRES_DB:-ACHInterbank}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: "no"
    networks: [ach_postgres_ci]

  achinterbank-api:
    build:
      context: .
      dockerfile: src/Cfa.ACHInterbank.Api/Dockerfile
    image: achinterbank-api:2026.07.24
    environment:
      Database__Provider: Postgres
      Database__ApplyMigrations: "${DATABASE_APPLY_MIGRATIONS:-true}"
      Database__ApplySeed: "${DATABASE_APPLY_SEED:-true}"
      ConnectionStrings__PostgresConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-ACHInterbank};Username=${POSTGRES_USER:-example_user};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria}"
      ASPNETCORE_URLS: "${ASPNETCORE_URLS:-http://+:8080}"
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      EnableHttpsRedirection: "${ENABLE_HTTPS_REDIRECTION:-false}"
      Quartz__JobStore__Mode: RAM
      Quartz__JobStore__Provider: Postgres
      Quartz__JobStore__Clustered: "false"
      Quartz__JobStore__PerformSchemaValidation: "false"
      DigitalEnvelope__CertificateSecretResolver__FailIfSecretProviderUnavailable: "false"
      DigitalEnvelope__CertificateBootstrap__Enabled: "false"
      ACH_SOAP_LIVE_TESTS: "${ACH_SOAP_LIVE_TESTS:-false}"
      RateLimiting__PermitLimit: "${RATE_LIMITING_PERMIT_LIMIT:-10}"
      RateLimiting__WindowSeconds: "${RATE_LIMITING_WINDOW_SECONDS:-1}"
      RateLimiting__QueueLimit: "${RATE_LIMITING_QUEUE_LIMIT:-2}"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-843}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live >/dev/null && curl -fsS http://localhost:8080/health/ready >/dev/null"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 60s
    restart: "no"
    networks: [ach_postgres_ci]

  achinterbank-spa:
    build:
      context: ./web/ach-interbank-ui
      dockerfile: Dockerfile
    image: achinterbank-spa:2026.07.24
    ports:
      - "127.0.0.1:${SPA_HOST_PORT:-743}:80"
    depends_on:
      achinterbank-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: "no"
    networks: [ach_postgres_ci]

networks:
  ach_postgres_ci:
    driver: bridge

volumes:
  ach_postgres_ci_data:
