name: angular-ci

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/angular-ci.yml"
      - "web/ach-interbank-ui/**"
  pull_request:
    paths:
      - ".github/workflows/angular-ci.yml"
      - "web/ach-interbank-ui/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web/ach-interbank-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: web/ach-interbank-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/ach-interbank-ui/playwright-report
          if-no-files-found: warn

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: web/ach-interbank-ui/test-results
          if-no-files-found: warn

      - name: Upload UAT Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-evidence-playwright
          path: |
            web/ach-interbank-ui/playwright-report
            web/ach-interbank-ui/test-results
          if-no-files-found: warn
