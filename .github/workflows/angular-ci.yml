name: angular-ci

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/angular-ci.yml"
      - "web/ach-interbank-ui/**"
  pull_request:
    paths:
      - ".github/workflows/angular-ci.yml"
      - "web/ach-interbank-ui/**"
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run runtime-backed Playwright E2E"
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: web/ach-interbank-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: web/ach-interbank-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --watch=false --browsers=ChromeHeadless

  runtime-backed-e2e:
    needs: build-and-test
    if: ${{ vars.RUN_E2E == 'true' || inputs.run_e2e == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: web/ach-interbank-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: web/ach-interbank-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start runtime stack
        env:
          POSTGRES_DB: ACHInterbank
          POSTGRES_USER: example_user
          POSTGRES_PASSWORD: example_password_change_me
          DATABASE_APPLY_MIGRATIONS: "true"
        run: docker compose -f ../../docker-compose.yml up -d --build postgres achinterbank-api achinterbank-spa

      - name: Wait for API readiness
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://localhost:843/health/ready >/tmp/health-ready.json; then
              cat /tmp/health-ready.json
              exit 0
            fi
            sleep 5
          done
          echo "API readiness timed out"
          exit 1

      - name: Wait for SPA readiness
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://localhost:743 >/tmp/spa-root.html; then
              head -n 20 /tmp/spa-root.html
              exit 0
            fi
            sleep 5
          done
          echo "SPA readiness timed out"
          exit 1

      - name: Playwright E2E
        env:
          E2E_BASE_URL: http://localhost:743
          E2E_API_BASE_URL: http://localhost:843
        run: npm run test:e2e:cycle-configs

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f ../../docker-compose.yml logs --no-color postgres achinterbank-api achinterbank-spa

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: web/ach-interbank-ui/playwright-report
          if-no-files-found: warn

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results
          path: web/ach-interbank-ui/test-results
          if-no-files-found: warn

      - name: Upload UAT Playwright evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: uat-evidence-playwright
          path: |
            web/ach-interbank-ui/playwright-report
            web/ach-interbank-ui/test-results
          if-no-files-found: warn
