            if docker exec outbound-return-sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$OUTBOUND_RETURN_SQLSERVER_PASSWORD" -C -Q 'SELECT 1' >/dev/null 2>&1; then sql_ready=true; fi
            if docker exec outbound-return-postgres pg_isready -U ach_test -d achinterbank_test >/dev/null 2>&1; then pg_ready=true; fi
            if [[ "$sql_ready" == true && "$pg_ready" == true ]]; then exit 0; fi
            sleep 5
          done
          echo 'SQL Server o PostgreSQL no quedó disponible dentro del tiempo máximo.' >&2
          exit 1

      - name: Restore
        run: dotnet restore tests/Cfa.ACHInterbank.Tests/Cfa.ACHInterbank.Tests.csproj

      - name: Build once
        run: dotnet build tests/Cfa.ACHInterbank.Tests/Cfa.ACHInterbank.Tests.csproj -c Release --no-restore --maxcpucount:1

      - name: Verify focused discovery
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/Cfa.ACHInterbank.Tests/Cfa.ACHInterbank.Tests.csproj \
            -c Release --no-build --no-restore --filter 'Category=OutboundReturnMultiDb' \
            --list-tests > outbound-return-tests.txt
          discovered="$(grep -c 'OutboundReturnMultiDbTests\.' outbound-return-tests.txt)"
          test "$discovered" -eq 4

      - name: Run ReturnOut multi-database tests
        run: >-
          dotnet test tests/Cfa.ACHInterbank.Tests/Cfa.ACHInterbank.Tests.csproj
          -c Release --no-build --no-restore --filter 'Category=OutboundReturnMultiDb'
          --logger 'trx;LogFileName=outbound-return-multidb.trx'
          --results-directory TestResults/OutboundReturn
          -- RunConfiguration.MaxCpuCount=1

      - name: Verify exact multi-database execution
