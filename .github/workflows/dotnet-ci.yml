name: dotnet-ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.300'

      - name: Restore
        run: dotnet restore ACHInterbank.sln

      - name: Build
        run: dotnet build ACHInterbank.sln -c Release --no-restore --maxcpucount:1

      - name: Test
        run: >-
          dotnet test tests/Cfa.ACHInterbank.Tests/Cfa.ACHInterbank.Tests.csproj
          -c Release --no-build --filter 'Category!=ClearingHouseMultiDb'
          --logger "trx;LogFileName=dotnet-tests.trx" --results-directory TestResults
          -- RunConfiguration.MaxCpuCount=1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults
