services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: achinterbank-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD es obligatoria}
    volumes:
      - ach_sqlserver_data:/var/opt/mssql
    ports:
      - "127.0.0.1:${SQLSERVER_HOST_PORT:-1433}:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\""
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped
    networks: [ach_onprem]

  quartz-schema:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: achinterbank-quartz-schema
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD es obligatoria}
    volumes:
      - ./artifacts/sql/quartz/sqlserver-qrtz-schema.sql:/schema/quartz.sql:ro
    command:
      - /bin/bash
      - -ec
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C
        -Q "IF DB_ID(N'${MSSQL_DB:-ACHInterbank}') IS NULL CREATE DATABASE [${MSSQL_DB:-ACHInterbank}]" &&
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C
        -d ${MSSQL_DB:-ACHInterbank} -b -i /schema/quartz.sql
    restart: "no"
    networks: [ach_onprem]

  achinterbank-api:
    environment:
      Database__Provider: SqlServer
      ConnectionStrings__SqlConnection: Server=sqlserver,1433;Database=${MSSQL_DB:-ACHInterbank};User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD es obligatoria};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=true
      Quartz__JobStore__Mode: Persistent
      Quartz__JobStore__Provider: SqlServer
      Quartz__JobStore__TablePrefix: QRTZ_
      Quartz__JobStore__Clustered: "true"
      Quartz__JobStore__PerformSchemaValidation: "true"
      Quartz__JobStore__AcquireTriggersWithinLock: "true"
      Quartz__SchedulerName: ACHInterbankScheduler
      Quartz__InstanceId: AUTO
    depends_on:
      quartz-schema:
        condition: service_completed_successfully
