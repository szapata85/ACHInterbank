name: achinterbank

# PostgreSQL is retained only as a separate legacy test/development variant in
# docker-compose.postgres.yml; it is not an active service in this Stack.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "${MSSQL_PID:-Developer}"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD es obligatoria}"
    volumes:
      - ach_sqlserver_data:/var/opt/mssql
    ports:
      - "127.0.0.1:${SQLSERVER_HOST_PORT:-1433}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    restart: unless-stopped
    networks: [ach_onprem]

  quartz-schema:
    image: achinterbank-quartz-schema:2026.07.24
    build:
      context: .
      dockerfile: docker/quartz-schema/Dockerfile
    entrypoint: ["/bin/bash"]
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD es obligatoria}"
      MSSQL_DB: "${MSSQL_DB:-ACHInterbank}"
    command:
      - -ec
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C
        -Q "IF DB_ID(N'$${MSSQL_DB}') IS NULL CREATE DATABASE [$${MSSQL_DB}]" &&
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C
        -d "$${MSSQL_DB}" -b -i /schema/quartz.sql
    restart: "no"
    networks: [ach_onprem]

  achinterbank-api:
    build:
      context: .
      dockerfile: src/Cfa.ACHInterbank.Api/Dockerfile
    image: achinterbank-api:2026.07.24
    environment:
      # The host/container zone is intentionally UTC by default. Operational
      # cycle decisions must use each clearing house TimeZoneId instead.
      TZ: "${API_HOST_TIME_ZONE:-UTC}"
      Database__Provider: SqlServer
      Database__ApplyMigrations: "${DATABASE_APPLY_MIGRATIONS:-true}"
      Database__ApplySeed: "${DATABASE_APPLY_SEED:-true}"
      ConnectionStrings__SqlConnection: "Server=sqlserver,1433;Database=${MSSQL_DB:-ACHInterbank};User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD es obligatoria};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=true"
      ASPNETCORE_URLS: "${ASPNETCORE_URLS:-http://+:8080}"
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      EnableHttpsRedirection: "${ENABLE_HTTPS_REDIRECTION:-false}"
      Quartz__JobStore__Mode: Persistent
      Quartz__JobStore__Provider: SqlServer
      Quartz__JobStore__TablePrefix: QRTZ_
      Quartz__JobStore__Clustered: "${QUARTZ_CLUSTERED:-false}"
      Quartz__JobStore__PerformSchemaValidation: "true"
      Quartz__JobStore__AcquireTriggersWithinLock: "true"
      Quartz__SchedulerName: ACHInterbankScheduler
      Quartz__InstanceId: AUTO
      DigitalEnvelope__CertificateSecretResolver__FailIfSecretProviderUnavailable: "false"
      DigitalEnvelope__CertificateBootstrap__Enabled: "false"
      RUN_LOCAL_SOAP_PROC_TRANSACCIONES_E2E: "${RUN_LOCAL_SOAP_PROC_TRANSACCIONES_E2E:-false}"
      ALLOW_LOCAL_MONETARY_SOAP_E2E: "${ALLOW_LOCAL_MONETARY_SOAP_E2E:-false}"
      ACH_SOAP_LIVE_TESTS: "${ACH_SOAP_LIVE_TESTS:-false}"
      ProcTransacciones__Mode: "${PROC_TRANSACCIONES_MODE:-DryRun}"
      RateLimiting__PermitLimit: "${RATE_LIMITING_PERMIT_LIMIT:-10}"
      RateLimiting__WindowSeconds: "${RATE_LIMITING_WINDOW_SECONDS:-1}"
      RateLimiting__QueueLimit: "${RATE_LIMITING_QUEUE_LIMIT:-2}"
    ports:
      - "843:8080"
    depends_on:
      quartz-schema:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live >/dev/null && curl -fsS http://localhost:8080/health/ready >/dev/null"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    networks: [ach_onprem]

  achinterbank-spa:
    build:
      context: ./web/ach-interbank-ui
      dockerfile: Dockerfile
    image: achinterbank-spa:2026.07.24
    ports:
      - "743:80"
    depends_on:
      achinterbank-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks: [ach_onprem]

networks:
  ach_onprem:
    driver: bridge

volumes:
  ach_sqlserver_data:
