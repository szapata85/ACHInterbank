name: achinterbank-onprem

services:
  openbao-volume-perms:
    image: busybox:1.36
    container_name: achinterbank-openbao-volume-perms
    command: ["sh", "-c", "mkdir -p /openbao/data && chmod -R 0777 /openbao/data"]
    volumes:
      - ach_openbao_data:/openbao/data
    restart: "no"
    networks: [ach_onprem]

  postgres:
    image: postgres:16
    container_name: achinterbank-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ACHInterbank}
      POSTGRES_USER: ${POSTGRES_USER:-sa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Cooperativa1*}
    volumes:
      - ach_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sa} -d ${POSTGRES_DB:-ACHInterbank}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [ach_onprem]

  openbao:
    image: openbao/openbao:2.2.0
    container_name: achinterbank-openbao
    command: ["server", "-config=/openbao/local-config/openbao.hcl"]
    cap_add:
      - IPC_LOCK
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - ./ops/openbao/openbao.hcl:/openbao/local-config/openbao.hcl:ro
      - ach_openbao_data:/openbao/data
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "status=$$(bao status -format=json 2>/dev/null || true); echo \"$$status\" | grep -q '\"initialized\"[[:space:]]*:[[:space:]]*true' && echo \"$$status\" | grep -q '\"sealed\"[[:space:]]*:[[:space:]]*false'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      openbao-volume-perms:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [ach_onprem]

  openbao-bootstrap:
    image: openbao/openbao:2.2.0
    container_name: achinterbank-openbao-bootstrap
    entrypoint:
      - /bin/sh
      - -c
      - sed 's/\r$//' /bootstrap/bootstrap-openbao-uat.sh > /tmp/bootstrap-openbao-uat.sh && chmod +x /tmp/bootstrap-openbao-uat.sh && /bin/sh /tmp/bootstrap-openbao-uat.sh
    environment:
      BAO_ADDR: http://openbao:8200
      OPENBAO_KV_MOUNT: ${OPENBAO_KV_MOUNT:-secret}
      OPENBAO_POLICY_NAME: ${OPENBAO_POLICY_NAME:-ach-api}
    volumes:
      - ./scripts/openbao/bootstrap-openbao-uat.sh:/bootstrap/bootstrap-openbao-uat.sh:ro
      - ./ops/openbao/policy-ach-api.hcl:/bootstrap/policy-ach-api.hcl:ro
      - ach_openbao_bootstrap:/bootstrap/state
    depends_on:
      openbao:
        condition: service_healthy
    restart: "no"
    networks: [ach_onprem]

  achinterbank-api:
    build:
      context: .
      dockerfile: src/Cfa.ACHInterbank.Api/Dockerfile
    image: achinterbank-api:openbao
    container_name: achinterbank-api
    environment:
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      EnableHttpsRedirection: ${ENABLE_HTTPS_REDIRECTION:-false}
      Database__Provider: Postgres
      ConnectionStrings__PostgresConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-ACHInterbank};Username=${POSTGRES_USER:-sa};Password=${POSTGRES_PASSWORD:-Cooperativa1*}
      Database__ApplyMigrations: "true"
      DigitalEnvelope__OpenBao__Enabled: "true"
      DigitalEnvelope__OpenBao__BaseUrl: http://openbao:8200
      DigitalEnvelope__OpenBao__KvMount: ${OPENBAO_KV_MOUNT:-secret}
      DigitalEnvelope__OpenBao__CertificatesPrefix: ${OPENBAO_CERTIFICATES_PREFIX:-certificates}
      DigitalEnvelope__OpenBao__ApiToken: ${OPENBAO_API_TOKEN:-}
      DigitalEnvelope__OpenBao__ApiTokenFilePath: /openbao-bootstrap/api-token
      DigitalEnvelope__CertificateSecretResolver__FailIfSecretProviderUnavailable: "true"
      WAIT_FOR_OPENBAO_TOKEN_FILE: "true"
      WAIT_FOR_OPENBAO_TIMEOUT_SECONDS: ${WAIT_FOR_OPENBAO_TIMEOUT_SECONDS:-90}
    ports:
      - "843:8080"
    volumes:
      - ach_openbao_bootstrap:/openbao-bootstrap:ro
    depends_on:
      postgres:
        condition: service_healthy
      openbao:
        condition: service_healthy
      openbao-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [ach_onprem]

  achinterbank-spa:
    build:
      context: ./web/ach-interbank-ui
      dockerfile: Dockerfile
    image: achinterbank-spa:openbao
    container_name: achinterbank-spa
    ports:
      - "743:80"
    depends_on:
      - achinterbank-api
    restart: unless-stopped
    networks: [ach_onprem]

networks:
  ach_onprem:
    driver: bridge

volumes:
  ach_postgres_data:
  ach_openbao_data:
  ach_openbao_bootstrap:
