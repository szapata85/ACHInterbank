name: achinterbank-onprem

services:
  achinterbank-api:
    build:
      context: .
      dockerfile: src/Cfa.ACHInterbank.Api/Dockerfile
    image: achinterbank-api:local
    container_name: achinterbank-api
    environment:
      Database__Provider: ${DATABASE_PROVIDER:-SqlServer}
      ConnectionStrings__SqlConnection: ${CONNECTIONSTRINGS__SQLCONNECTION:-Server=sqlserver,1433;Database=${MSSQL_DB:-ACHInterbank};User Id=sa;Password=${MSSQL_SA_PASSWORD:-Example_sqlServer_2026*};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=true}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      EnableHttpsRedirection: ${ENABLE_HTTPS_REDIRECTION:-false}
      Database__ApplyMigrations: ${DATABASE_APPLY_MIGRATIONS:-false}
      DigitalEnvelope__CertificateSecretResolver__FailIfSecretProviderUnavailable: "false"
    ports:
      - "843:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped
    networks: [ach_onprem]

  achinterbank-spa:
    build:
      context: ./web/ach-interbank-ui
      dockerfile: Dockerfile
    image: achinterbank-spa:local
    container_name: achinterbank-spa
    ports:
      - "743:80"
    depends_on:
      achinterbank-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks: [ach_onprem]

networks:
  ach_onprem:
    driver: bridge

volumes:
  ach_postgres_data:
  ach_sqlserver_data:
