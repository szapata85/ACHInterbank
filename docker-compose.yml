name: achinterbank

# Stack SQL Server local. Usar docker-ach.cmd (CMD) o dotnet run --project
# tools/AchInterbank.DockerCli -- <accion>; contraseña solo en appsettings.Development.json.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Use docker-ach.cmd o el ejecutor dotnet de tools/AchInterbank.DockerCli}"
    ports:
      - "127.0.0.1:${SQLSERVER_HOST_PORT:-1433}:1433"
    volumes:
      - ach_sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    restart: unless-stopped

  quartz-schema:
    image: mcr.microsoft.com/mssql/server:2025-latest
    entrypoint: ["/bin/bash"]
    command:
      - -ec
      - |
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b \
          -Q "IF DB_ID(N'$${MSSQL_DB}') IS NULL CREATE DATABASE [$${MSSQL_DB}]" 
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b \
          -d "$${MSSQL_DB}" -i /schema/quartz.sql
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Use docker-ach.cmd o el ejecutor dotnet de tools/AchInterbank.DockerCli}"
      MSSQL_DB: "${MSSQL_DB:-ACHInterbank}"
    volumes:
      - ./artifacts/sql/quartz/sqlserver-qrtz-schema.sql:/schema/quartz.sql:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  achinterbank-api:
    build:
      context: .
      dockerfile: src/Cfa.ACHInterbank.Api/Dockerfile
    image: achinterbank-api:local
    environment:
      TZ: UTC
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      EnableHttpsRedirection: "false"
      Database__Provider: SqlServer
      Database__ApplyMigrations: "${DATABASE_APPLY_MIGRATIONS:-true}"
      Database__ApplySeed: "${DATABASE_APPLY_SEED:-true}"
      ConnectionStrings__SqlConnection: "${ACH_DOCKER_SQL_CONNECTION:?Use docker-ach.cmd o el ejecutor dotnet de tools/AchInterbank.DockerCli}"
      Quartz__JobStore__Mode: Persistent
      Quartz__JobStore__Provider: SqlServer
      Quartz__JobStore__TablePrefix: QRTZ_
      Quartz__JobStore__Clustered: "false"
      Quartz__JobStore__PerformSchemaValidation: "true"
      Quartz__JobStore__AcquireTriggersWithinLock: "true"
      Quartz__SchedulerName: ACHInterbankScheduler
      Quartz__InstanceId: AUTO
      DigitalEnvelope__CertificateSecretResolver__FailIfSecretProviderUnavailable: "false"
      DigitalEnvelope__CertificateBootstrap__Enabled: "false"
      RUN_LOCAL_SOAP_PROC_TRANSACCIONES_E2E: "false"
      ALLOW_LOCAL_MONETARY_SOAP_E2E: "false"
      ACH_SOAP_LIVE_TESTS: "false"
      ProcTransacciones__Mode: DryRun
      RateLimiting__PermitLimit: "10"
      RateLimiting__WindowSeconds: "1"
      RateLimiting__QueueLimit: "2"
      CenitLocalGateway__Enabled: "false"
      CenitLocalGateway__InputPath: /var/ach/cenit/input
      CenitLocalGateway__OutputPath: /var/ach/cenit/output
      CenitLocalGateway__ArchivePath: /var/ach/cenit/archive
      CenitLocalGateway__PollIntervalMilliseconds: "250"
    volumes:
      # No incluye secretos de appsettings.Development.json en la imagen Docker.
      # Montaje solo para ejecución local; la conexión SQL se sobreescribe por ambiente.
      - ./src/Cfa.ACHInterbank.Api/appsettings.Development.json:/app/appsettings.Development.json:ro
      - ./.runtime/cenit:/var/ach/cenit
    ports:
      - "127.0.0.1:${API_HOST_PORT:-843}:8080"
    depends_on:
      quartz-schema:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live >/dev/null && curl -fsS http://localhost:8080/health/ready >/dev/null"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  achinterbank-spa:
    build:
      context: ./web/ach-interbank-ui
      dockerfile: Dockerfile
    image: achinterbank-spa:local
    ports:
      - "127.0.0.1:${SPA_HOST_PORT:-743}:80"
    depends_on:
      achinterbank-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  ach_sqlserver_data:
