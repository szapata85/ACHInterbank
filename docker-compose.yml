services:
  db-sqlserver:
    profiles: ["sqlserver"]
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: ACHinterbank-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-ChangeMe_SqlServer_OnlyForLocalDev!234}"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '>/dev/tcp/localhost/1433'"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-postgres:
    profiles: ["postgres"]
    image: postgres:16
    container_name: ACHinterbank-postgres
    environment:
      POSTGRES_DB: "ACHInterbank"
      POSTGRES_USER: "${POSTGRES_USER:-achinterbank}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ChangeMe_Postgres_OnlyForLocalDev!234}"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d ACHInterbank"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-sqlserver:
    profiles: ["sqlserver"]
    image: achinterbank-api:sqlserver
    build:
      context: .
      dockerfile: src/Cfa.ACHInterbank.Api/Dockerfile
    container_name: Cfa.ACHInterbank.Api
    environment:
      ASPNETCORE_URLS: "${ASPNETCORE_URLS:-http://+:8080}"
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      EnableHttpsRedirection: "${ENABLE_HTTPS_REDIRECTION:-false}"
      ASPNETCORE_Kestrel__Certificates__Default__Path: "/https/aspnetapp.pfx"
      ASPNETCORE_Kestrel__Certificates__Default__Password: "${ASPNETCORE_CERT_PASSWORD:-changeit-local-dev}"
      Database__Provider: "SqlServer"
      ConnectionStrings__SqlConnection: "${SQLSERVER_CONNECTION_STRING:-Server=db-sqlserver,1433;Database=ACHInterbank;User Id=sa;Password=ChangeMe_SqlServer_OnlyForLocalDev!234;TrustServerCertificate=True}"
      Database__ApplyMigrations: "${DATABASE_APPLY_MIGRATIONS:-false}"
      Database__CommandTimeoutSeconds: "180"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "744:8080"
    volumes:
      - ./certs:/https:rw
    depends_on:
      db-sqlserver:
        condition: service_healthy

  api-postgres:
    profiles: ["postgres"]
    image: achinterbank-api:postgres
    build:
      context: .
      dockerfile: src/Cfa.ACHInterbank.Api/Dockerfile
    container_name: Cfa.ACHInterbank.Api
    environment:
      ASPNETCORE_URLS: "${ASPNETCORE_URLS:-http://+:8080}"
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      EnableHttpsRedirection: "${ENABLE_HTTPS_REDIRECTION:-false}"
      ASPNETCORE_Kestrel__Certificates__Default__Path: "/https/aspnetapp.pfx"
      ASPNETCORE_Kestrel__Certificates__Default__Password: "${ASPNETCORE_CERT_PASSWORD:-changeit-local-dev}"
      Database__Provider: "Postgres"
      ConnectionStrings__PostgresConnection: "${POSTGRES_CONNECTION_STRING:-Host=db-postgres;Port=5432;Database=ACHInterbank;Username=achinterbank;Password=ChangeMe_Postgres_OnlyForLocalDev!234}"
      Database__ApplyMigrations: "${DATABASE_APPLY_MIGRATIONS:-false}"
      Database__CommandTimeoutSeconds: "180"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "744:8080"
    volumes:
      - ./certs:/https:rw
    depends_on:
      db-postgres:
        condition: service_healthy

  web:
    image: achinterbank-web:latest
    build:
      context: ./web/ach-interbank-ui
      dockerfile: Dockerfile
    container_name: ach-interbank-ui
    volumes:
      - ./certs:/https:rw
    ports:
      - "743:80"
