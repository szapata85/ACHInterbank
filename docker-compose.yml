version: "3.9"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ACHinterbank
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Cooperativa1*"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '>/dev/tcp/localhost/1433'"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Cfa.ACHInterbank.Api/Dockerfile
    container_name: Cfa.ACHInterbank.Api
    environment:
      ASPNETCORE_URLS: "https://+:8081;http://+:8080"
      ASPNETCORE_Kestrel__Certificates__Default__Path: "/https/aspnetapp.pfx"
      ASPNETCORE_Kestrel__Certificates__Default__Password: "changeit"
      ConnectionStrings__SqlConnection: "Server=db,1433;Database=ACHInterbank;User Id=sa;Password=Cooperativa1*;TrustServerCertificate=True"
      Database__ApplyMigrations: "true"
      Database__AllowSeed: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./certs:/https:rw
    depends_on:
      db:
        condition: service_healthy
