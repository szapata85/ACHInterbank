name: achinterbank-onprem

services:
  postgres:
    image: postgres:16
    container_name: achinterbank-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ACHInterbank}
      # Local/demo placeholders only. Use an untracked .env or secret manager for UAT/prod.
      POSTGRES_USER: ${POSTGRES_USER:-example_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example_password_change_me}
    volumes:
      - ach_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-example_user} -d ${POSTGRES_DB:-ACHInterbank}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [ach_onprem]

  achinterbank-api:
    build:
      context: .
      dockerfile: src/Cfa.ACHInterbank.Api/Dockerfile
    image: achinterbank-api:local
    container_name: achinterbank-api
    environment:
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      EnableHttpsRedirection: ${ENABLE_HTTPS_REDIRECTION:-false}
      Database__Provider: Postgres
      ConnectionStrings__PostgresConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-ACHInterbank};Username=${POSTGRES_USER:-example_user};Password=${POSTGRES_PASSWORD:-example_password_change_me}
      Database__ApplyMigrations: "true"
      DigitalEnvelope__CertificateSecretResolver__FailIfSecretProviderUnavailable: "false"
    ports:
      - "843:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [ach_onprem]

  achinterbank-spa:
    build:
      context: ./web/ach-interbank-ui
      dockerfile: Dockerfile
    image: achinterbank-spa:local
    container_name: achinterbank-spa
    ports:
      - "743:80"
    depends_on:
      achinterbank-api:
        condition: service_started
    restart: unless-stopped
    networks: [ach_onprem]

networks:
  ach_onprem:
    driver: bridge

volumes:
  ach_postgres_data:
