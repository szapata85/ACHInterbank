name: achinterbank-onprem

services:
  achinterbank-api:
    build:
      context: .
      dockerfile: src/Cfa.ACHInterbank.Api/Dockerfile
    image: achinterbank-api:local
    container_name: achinterbank-api
    environment:
      Database__Provider: ${DATABASE_PROVIDER:-}
      ConnectionStrings__SqlConnection: ${CONNECTIONSTRINGS__SQLCONNECTION:-}
      ConnectionStrings__PostgresConnection: ${CONNECTIONSTRINGS__POSTGRESCONNECTION:-}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      EnableHttpsRedirection: ${ENABLE_HTTPS_REDIRECTION:-false}
      Database__ApplyMigrations: ${DATABASE_APPLY_MIGRATIONS:-false}
      DigitalEnvelope__CertificateSecretResolver__FailIfSecretProviderUnavailable: "false"
      DigitalEnvelope__CertificateBootstrap__Enabled: ${DIGITAL_ENVELOPE_CERTIFICATE_BOOTSTRAP_ENABLED:-true}
      DigitalEnvelope__CertificateBootstrap__DirectoryPath: ${DIGITAL_ENVELOPE_CERTIFICATE_BOOTSTRAP_CONTAINER_PATH:-/app/certificates/uat}
      DigitalEnvelope__CertificateBootstrap__PfxPassword: ${DIGITAL_ENVELOPE_BOOTSTRAP_PFX_PASSWORD:-}
    volumes:
      - ./docs/uat/certificados_pruebas:/app/certificates/uat:ro
    ports:
      - "843:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped
    networks: [ach_onprem]

  achinterbank-spa:
    build:
      context: ./web/ach-interbank-ui
      dockerfile: Dockerfile
    image: achinterbank-spa:local
    container_name: achinterbank-spa
    ports:
      - "743:80"
    depends_on:
      achinterbank-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks: [ach_onprem]

networks:
  ach_onprem:
    driver: bridge

volumes:
  ach_postgres_data:
  ach_sqlserver_data:
